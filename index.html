  let cartons=0, pieces=0, value=0;
  Object.entries(state.cart).forEach(([art, ctn]) => {
    const sku = state.skusByArt[art]; if(!sku) return;
    cartons += ctn; pieces += ctn*(Number(sku.pcPerCs)||0); value += ctn*(Number(sku.csPrice)||0);
  });
  return {cartons, pieces, value};
}

// Store-level stock hero: shows total on-hand value the moment a store opens, and its
// big number + color follow whichever category chip is active (all → whole store,
// Ice Cream → just the ice-cream value actually sitting in that store). The per-category
// breakdown is one tap away, and each bar is itself a shortcut to that category.
function renderStockSummary(store, onCategoryPick){
  const st = storeStock(store.storeNo);
  const box = el("div", {class:"stocksum"});

  const hero = el("div", {class:"hero"});
  const lbl = el("div", {class:"lbl"});
  const dotc = el("span", {class:"dotc"});
  lbl.appendChild(dotc); lbl.appendChild(el("span", {class:"lbltxt"}, [t("storeStockTitle")]));
  const big = el("div", {class:"big"});
  const sub = el("div", {class:"sub"});
  hero.appendChild(lbl); hero.appendChild(big); hero.appendChild(sub);
  const expand = el("button", {class:"expand"}, [t("byCategory"), el("span",{class:"ct"},["▾"])]);
  hero.appendChild(expand);
  box.appendChild(hero);

  const body = el("div", {class:"body"});
  const maxVal = st.cats.reduce((a,c) => Math.max(a, c.value), 0) || 1;
  st.cats.forEach(c => {
    const m = catMeta(c.cat);
    const row = el("div", {class:"catbar", "data-cat":c.cat, onclick:() => onCategoryPick && onCategoryPick(c.cat)}, [
      el("span", {class:"sw", style:"background:"+m.color}),
      el("span", {class:"nm"}, [catLabel(c.cat)]),
      el("span", {class:"bar"}, [ el("i", {style:"width:"+Math.max(4, Math.round(c.value/maxVal*100))+"%;background:"+m.color}) ]),
      el("span", {class:"vl"}, [ state.hidePrices ? fmtInt(c.pieces) : fmtMoney(c.value) ])
    ]);
    body.appendChild(row);
  });
  const mt = el("div", {class:"moneytoggle"});
  mt.appendChild(el("span", {}, [t("hidePrices")]));
  const sw = el("label", {class:"switch"});
  const cb = el("input", {type:"checkbox"});
  cb.checked = state.hidePrices;
  cb.addEventListener("change", () => {
    state.hidePrices = cb.checked;
    localStorage.setItem("oo_hidePrices", cb.checked ? "1" : "0");
    render();
  });
  sw.appendChild(cb); sw.appendChild(el("span",{class:"track"})); sw.appendChild(el("span",{class:"thumb"}));
  mt.appendChild(sw);
  body.appendChild(mt);
  box.appendChild(body);

  expand.onclick = () => { box.classList.toggle("open"); expand.querySelector(".ct").textContent = box.classList.contains("open") ? "▴" : "▾"; };

  // Repaint the hero for whatever category is active — called on open and on every chip tap.
  function paint(){
    const cat = state.category;
    const cs = categoryStock(store.storeNo, cat);
    const m = cat === "all" ? null : catMeta(cat);
    dotc.style.background = m ? m.color : "var(--green-light)";
    hero.style.background = m ? ("linear-gradient(135deg, "+m.color+"22 0%, transparent 60%)") : "transparent";
    lbl.querySelector(".lbltxt").textContent = cat === "all"
      ? t("storeStockTitle")
      : (t("stockValue")+" — "+catLabel(cat));
    big.innerHTML = "";
    if(state.hidePrices){
      big.appendChild(document.createTextNode(fmtInt(cs.pieces)));
      big.appendChild(el("span",{class:"u"},[t("pieces")]));
    } else {
      big.appendChild(document.createTextNode(fmtMoney(cs.value)));
      big.appendChild(el("span",{class:"u"},[curr()]));
    }
    sub.textContent = fmtInt(cs.skus)+" "+t("skuCount")+"  ·  "+fmtInt(cs.pieces)+" "+t("pieces")
      + (cat==="all" && st.outOfStock ? ("  ·  "+fmtInt(st.outOfStock)+" "+t("outOfStock")) : "");
    // mark the active bar
    body.querySelectorAll(".catbar").forEach(r => r.classList.toggle("on", r.getAttribute("data-cat") === cat));
  }
  paint();
  box._paint = paint;
  return box;
}

// "What's new" for a store since the last update: items newly supplied here, brand-new items that
// this store did NOT get (missing / not supplied), and items that disappeared. Collapsible card.
function renderStoreWhatsNew(store){
  const d = storeItemDiff(store.storeNo);
  if(!d) return null;
  const { added, missing, removed } = d;
  if(!added.length && !missing.length && !removed.length) return null;
  const nameOfArt = a => { const sk=state.skusByArt[a]; return sk ? (cleanName(sk.nameEn)||arName(sk.nameAr)||("#"+a)) : ("#"+a); };
  const codeOfArt = a => { const sk=state.skusByArt[a]; return sk ? sk.artecalCode : String(a); };
  const card = el("div", {class:"whatsnew"});
  const head = el("div", {class:"wn-head"});
  const left = el("div", {class:"wn-head-l"});
  left.appendChild(el("div", {class:"wn-title"}, ["🆕 "+t("whatsNewTitle")]));
  const badges = el("div", {class:"wn-badges"});
  if(added.length) badges.appendChild(el("span",{class:"wn-b added"},["＋"+fmtInt(added.length)+" "+t("wnAdded")]));
  if(missing.length) badges.appendChild(el("span",{class:"wn-b missing"},[fmtInt(missing.length)+" "+t("wnMissing")]));
  if(removed.length) badges.appendChild(el("span",{class:"wn-b removed"},["−"+fmtInt(removed.length)+" "+t("wnRemoved")]));
  left.appendChild(badges);
  head.appendChild(left);
  head.appendChild(el("span",{class:"wn-chev"},["▾"]));
  card.appendChild(head);
  const body = el("div", {class:"wn-body"});
  const section = (titleKey, arts, cls) => {
    if(!arts.length) return;
    body.appendChild(el("div",{class:"wn-sec "+cls},[t(titleKey)+" ("+fmtInt(arts.length)+")"]));
    arts.slice(0,60).forEach(a => body.appendChild(el("div",{class:"wn-item"},[
      el("span",{class:"wn-code"},[codeOfArt(a)]), el("span",{class:"wn-name"},[nameOfArt(a)])
    ])));
    if(arts.length>60) body.appendChild(el("div",{class:"login-sub",style:"padding:4px 2px;"},["+"+fmtInt(arts.length-60)]));
  };
  section("wnMissingTitle", missing, "missing");
  section("wnAddedTitle", added, "added");
  section("wnRemovedTitle", removed, "removed");
  card.appendChild(body);
  head.onclick = () => { card.classList.toggle("open"); head.querySelector(".wn-chev").textContent = card.classList.contains("open") ? "▴" : "▾"; };
  return card;
}

function renderItems(){
  const store = state.selectedStore;
  const s = el("div", {class:"screen"});
  s.appendChild(topbar({
    title: store.nameAr, subtitle: t("storeNo")+" "+store.storeNo,
    onBack: () => { state.screen="stores"; render(); },
    cartCount: cartLineCount(), onCart: () => { goToCart(); }
  }));
  const content = el("div", {class:"content", style:"gap:10px;"});
  const onHand = OO.onHand[String(store.storeNo)] || {};

  const hero = renderStockSummary(store, (cat) => { state.category = cat; drawChips(); drawList(); });
  content.appendChild(hero);

  const wn = renderStoreWhatsNew(store);
  if(wn) content.appendChild(wn);

  const search = el("input", {class:"input", placeholder:t("searchItems"), value: state.query});
  content.appendChild(el("div", {class:"searchbox"}, [svgIcon("search"), search]));

  // Opportunity / gap filter: show only items Mars has, that this store is out of (or nearly).
  const gapBar = el("div", {class:"gapbar"});
  content.appendChild(gapBar);
  function storeGapCount(){ let n=0; OO.skus.forEach(sk=>{ if(isGapItem(sk, onHand[sk.artecal], state.gapThreshold)) n++; }); return n; }
  function drawGapBar(){
    gapBar.innerHTML = "";
    const count = storeGapCount();
    const btn = el("button", {class:"gaptoggle"+(state.gapOnly?" on":""), onclick:()=>{ state.gapOnly=!state.gapOnly; drawGapBar(); drawList(); }}, [
      el("span",{class:"gt-ic"},["🎯"]), el("span",{class:"gt-l"},[t("gapFilter")]), el("span",{class:"gt-n"},[fmtInt(count)])
    ]);
    gapBar.appendChild(btn);
    if(state.gapOnly){
      const ctrl = el("div", {class:"gapthresh"});
      ctrl.appendChild(el("span",{class:"gt-cap"},[t("gapThreshLabel")]));
      [0,1,2,3].forEach(n=>ctrl.appendChild(el("button",{class:"gt-opt"+(state.gapThreshold===n?" on":""),
        onclick:()=>{ state.gapThreshold=n; try{localStorage.setItem("oo_gapThreshold",String(n));}catch(e){} drawGapBar(); drawList(); }},[String(n)])));
      gapBar.appendChild(ctrl);
      gapBar.appendChild(el("div",{class:"gap-hint"},[t("gapHint")]));
    }
  }

  const chips = el("div", {class:"chiprow"});
  content.appendChild(chips);

  const vs = el("div", {class:"viewswitch"});
  // Switch order/list WITHOUT a full re-render (only the list needs to change) — keeps it snappy.
  const setView = (mode) => {
    state.viewMode = mode; localStorage.setItem("oo_viewMode", mode);
    const btns = vs.querySelectorAll("button");
    if(btns[0]) btns[0].classList.toggle("active", mode==="order");
    if(btns[1]) btns[1].classList.toggle("active", mode==="list");
    list.style.gap = (mode==="list"?"6px":"10px");
    drawList();
  };
  vs.appendChild(el("button", {class: state.viewMode==="order"?"active":"", onclick:() => setView("order")}, [t("viewOrder")]));
  vs.appendChild(el("button", {class: state.viewMode==="list"?"active":"", onclick:() => setView("list")}, [t("viewList")]));
  content.appendChild(vs);

  const bulk = el("div", {class:"bulkrow"});
  bulk.appendChild(el("button", {class:"btn btn-outline", onclick:() => applyAllSuggested()}, [t("applyAll")]));
  bulk.appendChild(el("button", {class:"btn btn-outline", onclick:() => {
    if(cartLineCount() === 0) return;
    if(confirm(t("clearAll")+"?")){ state.cart = {}; drawList(); updateFloatbar(); }
  }}, [t("clearAll")]));
  content.appendChild(bulk);

  const list = el("div", {style:"display:flex;flex-direction:column;gap:"+(state.viewMode==="list"?"6px":"10px")+";margin-top:2px;"});
  content.appendChild(list);

  // Fills in the suggested quantity for everything currently visible (respects the category chip,
  // the search box, and the opportunity filter), so a category can be ordered in one pass.
  function applyAllSuggested(){
    const q = search.value.trim();
    const visible = OO.skus.filter(sk => (state.category==="all" || sk.category===state.category) && passesGap(sk) && matches(sk, q));
    let n = 0, cartons = 0;
    visible.forEach(sk => {
      const sug = suggestFor(sk, onHand[sk.artecal]);
      if(sug.cartons > 0){ state.cart[sk.artecal] = sug.cartons; n++; cartons += sug.cartons; }
    });
    if(n === 0){ toast(t("noNeed")); return; }
    toast(fmtInt(n)+" "+t("skuCount")+"  ·  "+fmtInt(cartons)+" "+t("cartons"), "success");
    drawList(); updateFloatbar();
  }

  function categoriesPresent(){
    const set = {};
    OO.skus.forEach(sk => set[sk.category] = (set[sk.category]||0)+1);
    return set;
  }
  function drawChips(){
    chips.innerHTML = "";
    const cats = categoriesPresent();
    const allChip = el("div", {class:"chip"+(state.category==="all"?" active":""), onclick:() => {state.category="all"; drawChips(); drawList();}}, [t("all")]);
    chips.appendChild(allChip);
    Object.keys(cats).sort((a,b)=> cats[b]-cats[a]).forEach(cat => {
      const m = catMeta(cat);
      const chip = el("div", {class:"chip"+(state.category===cat?" active":""),
        style: state.category===cat ? ("background:"+m.color+";border-color:"+m.color) : "",
        onclick:() => {state.category=cat; drawChips(); drawList();}}, [
        el("span", {class:"sw", style:"background:"+m.color}), catLabel(cat)
      ]);
      chips.appendChild(chip);
    });
    if(hero._paint) hero._paint();  // keep the hero total in sync with the active category
  }

  function matches(sku, q){
    if(!q) return true;
    q = q.toLowerCase();
    return String(sku.artecal).includes(q) || codeStr(sku).includes(q) || String(sku.zrep).includes(q) ||
      (sku.nameAr||"").toLowerCase().includes(q) || (sku.nameEn||"").toLowerCase().includes(q);
  }
  function passesGap(sk){ return !state.gapOnly || isGapItem(sk, onHand[sk.artecal], state.gapThreshold); }

  let drawToken = 0;   // cancels a half-finished chunked draw when a newer draw starts
  function drawList(){
    const myToken = ++drawToken;
    list.innerHTML = "";
    const q = search.value.trim();
    const filtered = OO.skus.filter(sk => (state.category==="all" || sk.category===state.category) && passesGap(sk) && matches(sk, q));
    if(filtered.length === 0){ list.appendChild(el("div",{class:"emptystate"},[t(state.gapOnly ? "noGaps" : "catNoLines")])); return; }
    if(state.viewMode === "list"){ drawGrouped(filtered); return; }
    filtered.sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
    // Paint the first cards right away, then stream the rest across animation frames so opening a
    // store / switching a category feels instant instead of freezing on ~300 cards at once.
    const CHUNK = 26; let i = 0;
    (function step(){
      if(myToken !== drawToken) return;   // a newer draw replaced this one — stop
      const frag = document.createDocumentFragment();
      const end = Math.min(i + CHUNK, filtered.length);
      for(; i < end; i++) frag.appendChild(renderItemCard(filtered[i], onHand[filtered[i].artecal], i+1));
      list.appendChild(frag);
      if(i < filtered.length) (window.requestAnimationFrame || window.setTimeout)(step);
    })();
  }

  // Grouped list: one category block after another, and inside each block the items
  // of the same brand sit together (all the Snickers lines under each other, etc.).
  function drawGrouped(filtered){
    groupSeq = 0;
    const byCat = {};
    filtered.forEach(sk => { const c = sk.category || "Uncategorized"; (byCat[c] = byCat[c] || []).push(sk); });
    Object.keys(byCat).sort((a,b) => byCat[b].length - byCat[a].length).forEach(cat => {
      const items = byCat[cat].sort((a,b) =>
        String(a.brand||"zz").localeCompare(String(b.brand||"zz")) || nameOf(a).localeCompare(nameOf(b)));
      const m = catMeta(cat);
      list.appendChild(el("div", {class:"catgroup"}, [
        el("span", {class:"sw", style:"background:"+m.color}),
        el("span", {class:"nm"}, [catLabel(cat)]),
        el("span", {class:"ct"}, [String(items.length)+" "+t("skuCount")])
      ]));
      let lastBrand = null;
      items.forEach(sk => {
        const b = String(sk.brand||"").trim();
        if(b && b !== lastBrand){ list.appendChild(el("div", {class:"brandsep"}, [b])); lastBrand = b; }
        groupSeq++;
        list.appendChild(renderListRow(sk, onHand[sk.artecal], groupSeq));
      });
    });
  }
  let groupSeq = 0;

  function renderListRow(sku, oh, seq){
    const ctn = state.cart[sku.artecal] || 0;
    const ohQty = oh ? Number(oh.onHand)||0 : 0;
    const per = Number(sku.pcPerCs)||0;
    const cs = ohCartons(ohQty, per);
    const sug = suggestFor(sku, oh);

    const row = el("div", {class:"listrow"+(ctn>0?" has-order":"")+(ohQty<=0?" oos":"")});
    if(seq) row.appendChild(el("div", {class:"lseq"}, [String(seq)]));
    const li = el("div", {class:"li"});
    const np = nameParts(sku);
    li.appendChild(el("div", {class:"ln"}, [np.primary]));
    if(np.secondary) li.appendChild(el("div", {class:"lnAr", dir:"rtl"}, [np.secondary]));
    // One dense metrics line per row, reading like the sheet the rep already uses:
    // code · on hand · on hand in cartons · stock value.
    const meta = el("div", {class:"rowmeta"+(ohQty<=0?" oos":"")});
    meta.appendChild(el("b", {class:"code"}, [codeStr(sku)]));
    meta.appendChild(el("span", {class:"sep"}, ["·"]));
    meta.appendChild(el("span", {}, [t("onHand")+" ", el("b",{},[fmtInt(ohQty)])]));
    if(cs){
      meta.appendChild(el("span", {class:"sep"}, ["·"]));
      meta.appendChild(el("span", {}, [el("b",{},[cs.text]), " "+t("cartons")]));
    }
    if(!state.hidePrices){
      meta.appendChild(el("span", {class:"sep"}, ["·"]));
      meta.appendChild(el("span", {}, [el("b",{},[fmtMoney(ohQty*(Number(sku.pcPrice)||0))]), " "+curr()]));
    }
    li.appendChild(meta);
    row.appendChild(li);

    const step = el("div", {class:"ministep"});
    const wrap = el("div", {style:"display:flex;flex-direction:column;align-items:center;"});
    const inner = el("div", {style:"display:flex;align-items:center;gap:4px;"});
    const minus = el("button", {}, ["–"]);
    const input = el("input", {type:"tel", inputmode:"numeric", value: ctn || ""});
    const plus = el("button", {}, ["+"]);
    inner.appendChild(minus); inner.appendChild(input); inner.appendChild(plus);
    wrap.appendChild(inner);
    const sugBtn = el("button", {class:"sug"}, [sug.cartons > 0 ? (t("suggested")+" "+sug.cartons) : ""]);
    if(sug.cartons > 0){ sugBtn.onclick = () => setQty(sug.cartons); wrap.appendChild(sugBtn); }
    step.appendChild(wrap);
    row.appendChild(step);

    function setQty(v){
      v = Math.max(0, Math.floor(Number(v)||0));
      input.value = v || "";
      if(v>0) state.cart[sku.artecal]=v; else delete state.cart[sku.artecal];
      row.classList.toggle("has-order", v>0);
      updateFloatbar();
    }
    minus.onclick = () => setQty((Number(input.value)||0)-1);
    plus.onclick = () => setQty((Number(input.value)||0)+1);
    input.addEventListener("input", () => setQty(input.value));
    return row;
  }

  function renderItemCard(sku, oh, seq){
    const m = catMeta(sku.category);
    const ctn = state.cart[sku.artecal] || 0;
    const ohQty = oh ? Number(oh.onHand)||0 : 0;
    const marsQ = OO.marsStock[sku.artecal] ? Number(OO.marsStock[sku.artecal].qty)||0 : 0;
    const pcPerCs = Number(sku.pcPerCs)||0;
    const cs = ohCartons(ohQty, pcPerCs);
    const sug = suggestFor(sku, oh);
    const np = nameParts(sku);

    const card = el("div", {class:"itemcard"+(ctn>0?" has-order":"")+(ohQty<=0?" oos":""), style:"--cat:"+m.color});

    // head: seq number, name (+arabic), code chip; category = left accent color
    const head = el("div", {class:"ic-head"});
    if(seq) head.appendChild(el("span", {class:"seq"}, [String(seq)]));
    const titles = el("div", {class:"titles"});
    titles.appendChild(el("div", {class:"name"}, [np.primary]));
    if(np.secondary) titles.appendChild(el("div", {class:"nameAr", dir:"rtl"}, [np.secondary]));
    head.appendChild(titles);
    head.appendChild(el("span", {class:"code"}, [codeStr(sku)]));
    card.appendChild(head);

    // clear 4-cell grid: On Hand (pcs) · In Cartons · Pack · Mars
    const grid = el("div", {class:"ic-grid"});
    const cell = (cls, k, v, sub) => {
      const c = el("div", {class:"cell"+(cls?" "+cls:"")});
      c.appendChild(el("div", {class:"k"}, [k]));
      const val = el("div", {class:"v"}, [v]);
      if(sub) val.appendChild(el("small", {}, [" "+sub]));
      c.appendChild(val);
      return c;
    };
    grid.appendChild(cell("oh"+(ohQty<=0?" low":""), t("gridOnHand"), fmtInt(ohQty), t("pieces")));
    grid.appendChild(cell("", t("inCtn"), cs ? cs.text : "—", state.lang==="ar"?"ك":"ctn"));
    grid.appendChild(cell("", t("packShort"), fmtInt(pcPerCs)));
    grid.appendChild(cell("mars", t("marsShort"), fmtInt(marsQ)));
    card.appendChild(grid);

    // order row: suggested chip (tap to fill) + stepper + live value
    const order = el("div", {class:"ic-order"});
    if(sug.cartons > 0){
      order.appendChild(el("button", {class:"sugchip"+(sug.reason==="oos"?" oos":""), onclick:() => setQty(sug.cartons)}, [
        t("suggested"), el("b",{},[String(sug.cartons)]) ]));
    } else {
      order.appendChild(el("span", {class:"sugchip none"}, [
        sug.capReason==="nomars" ? t("marsNone") : sug.capReason==="marspartial" ? t("marsPartial") : (ohQty<=0 ? t("outOfStock") : t("noNeed")) ]));
    }
    const step = el("div", {class:"step"});
    const minus = el("button", {}, ["–"]);
    const input = el("input", {type:"tel", inputmode:"numeric", value: ctn || ""});
    const plus = el("button", {}, ["+"]);
    step.appendChild(minus); step.appendChild(input); step.appendChild(plus);
    order.appendChild(step);
    const ov = el("div", {class:"ov"});
    order.appendChild(ov);
    card.appendChild(order);
    const warn = el("div", {class:"ic-warn", hidden:true});
    card.appendChild(warn);

    function refreshVal(){
      const c = Number(input.value)||0;
      ov.innerHTML = "";
      if(state.hidePrices){
        if(c>0) ov.appendChild(el("b",{},[fmtInt(c*pcPerCs)+" "+t("pieces")]));
      } else if(c>0){
        ov.appendChild(el("b",{},[fmtMoney(c*(Number(sku.csPrice)||0))+" "+curr()]));
      } else {
        ov.appendChild(document.createTextNode(fmtMoney(sku.csPrice)+" "+curr()+" / "+t("cartons")));
      }
      // Guard rail: only surface a line when the quantity actually overshoots — no noise otherwise.
      const w = c>0 ? qtyWarning(sku, oh, c) : null;
      if(w){ warn.hidden=false; warn.innerHTML=""; warn.appendChild(el("span",{},["⚠"])); warn.appendChild(el("span",{},[t(w.key)+(sug.max>0?" · "+t("shelfMax")+" "+fmtInt(sug.max):"")])); }
      else warn.hidden = true;
    }
    function setQty(v){
      v = Math.max(0, Math.floor(Number(v)||0));
      input.value = v || "";
      if(v>0) state.cart[sku.artecal]=v; else delete state.cart[sku.artecal];
      card.classList.toggle("has-order", v>0);
      refreshVal();
      updateFloatbar();
    }
    minus.onclick = () => setQty((Number(input.value)||0)-1);
    plus.onclick = () => setQty((Number(input.value)||0)+1);
    input.addEventListener("input", () => setQty(input.value));
    refreshVal();
    return card;
  }

  let floatbar;
  function updateFloatbar(){
    const totals = cartTotals();
    const count = cartLineCount();
    if(floatbar) floatbar.remove();
    if(count === 0) return;
    floatbar = el("div", {class:"floatbar"}, [
      el("div", {class:"fcount"}, [String(count)+" "+t("items")]),
      el("div", {class:"fsum"}, [ t("totalCartons")+": ", el("b",{},[fmtInt(totals.cartons)]) ].concat(
        state.hidePrices ? [] : ["   ", el("b",{},[fmtMoney(totals.value)+" "+curr()])])),
      el("button", {class:"btn btn-primary", onclick: () => { goToCart(); }}, [t("reviewOrder")])
    ]);
    s.appendChild(floatbar);
    const badge = $(".cartbadge", s);
    const btn = $(".cartbtn", s);
    if(btn){ if(badge) badge.remove(); if(count>0) btn.appendChild(el("span",{class:"cartbadge"},[String(count)])); }
  }

  // Debounced: redrawing 300+ item cards on every keystroke is what made typing lag.
  let searchTimer = null;
  search.addEventListener("input", () => {
    state.query = search.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(drawList, 120);
  });
  drawGapBar(); drawChips(); drawList();
  s.appendChild(content);
  updateFloatbar();
  return s;
}

/* ---------------- CART / REVIEW SCREEN ---------------- */
// Enter the review screen with the file options at their FIXED default (On Hand on; price,
// item values and grand total off). Resetting happens only on entry — toggling inside the
// screen re-renders via render() (not this), so a rep's one-off choice sticks until they leave.
function goToCart(){
  state.prefShowOnHandCols = true;
  state.prefShowPrice = false;
  state.prefShowValues = false;
  state.prefShowTotal = false;
  state.screen = "cart";
  render();
}
function renderCart(){
  const store = state.selectedStore;
  const s = el("div", {class:"screen"});
  s.appendChild(topbar({title: t("reviewOrder"), subtitle: store.nameAr, onBack: () => { state.screen="items"; render(); }}));
  const content = el("div", {class:"content"});

  const lines = Object.entries(state.cart);
  if(lines.length === 0){
    content.appendChild(el("div", {class:"emptystate"}, [t("cartEmpty")]));
    content.appendChild(el("button", {class:"btn btn-outline btn-block", onclick: () => { state.screen="items"; render(); }}, [t("backToItems")]));
    s.appendChild(content);
    return s;
  }

  let repaintTotals = () => {};   // wired up after the totals box is built

  const listWrap = el("div", {style:"display:flex;flex-direction:column;gap:6px;"});
  lines.forEach(([art, ctn], idx) => {
    const sku = state.skusByArt[art]; if(!sku) return;
    const line = el("div", {class:"cartline"});
    const np = nameParts(sku);

    // top row: seq + name (+ arabic) + code, and remove
    const ci = el("div", {class:"ci"});
    const nmLine = el("div", {class:"cn"}, [ el("span",{class:"cseq"},[String(idx+1)]), np.primary ]);
    ci.appendChild(nmLine);
    if(np.secondary) ci.appendChild(el("div", {class:"cnAr", dir:"rtl"}, [np.secondary + "  ·  " + codeStr(sku)]));
    else ci.appendChild(el("div", {class:"cnAr"}, [codeStr(sku)]));
    const rm = el("button", {class:"rm", onclick: () => { delete state.cart[art]; render(); }}, ["×"]);
    line.appendChild(el("div", {class:"top"}, [ci, rm]));

    // bottom row: editable carton quantity + live value
    const step = el("div", {class:"cartstep"});
    step.appendChild(el("span", {class:"lbl"}, [t("cartons")]));
    const minus = el("button", {}, ["–"]);
    const input = el("input", {type:"tel", inputmode:"numeric", value:String(ctn)});
    const plus = el("button", {}, ["+"]);
    step.appendChild(minus); step.appendChild(input); step.appendChild(plus);
    const cv = el("div", {class:"cv"});
    function paintVal(){
      const c = Number(state.cart[art])||0;
      cv.innerHTML = "";
      if(!state.hidePrices){
        cv.appendChild(el("b", {}, [fmtMoney(c*(Number(sku.csPrice)||0))+" "+curr()]));
        cv.appendChild(el("span", {class:"u"}, [fmtMoney(sku.csPrice)+" / "+t("cartons")]));
      }
      cv.appendChild(el("span", {class:"u"}, [fmtInt(c*sku.pcPerCs)+" "+t("pieces")]));
    }
    function setQty(v){
      v = Math.max(0, Math.floor(Number(v)||0));
      if(v <= 0){ delete state.cart[art]; render(); return; }  // removing shrinks the list → full re-render
      state.cart[art] = v; input.value = String(v);
      paintVal(); repaintTotals();
    }
    minus.onclick = () => setQty((Number(input.value)||0)-1);
    plus.onclick  = () => setQty((Number(input.value)||0)+1);
    input.addEventListener("change", () => setQty(input.value));
    paintVal();
    line.appendChild(el("div", {class:"bottom"}, [step, cv]));
    listWrap.appendChild(line);
  });
  content.appendChild(listWrap);

  const togglesCard = el("div", {class:"card card-pad"});
  function toggleRow(labelKey, getVal, setVal){
    const row = el("div", {class:"togglerow"});
    row.appendChild(el("div", {class:"tl"}, [t(labelKey)]));
    const sw = el("label", {class:"switch"});
    const cb = el("input", {type:"checkbox"});
    cb.checked = getVal();
    cb.addEventListener("change", () => setVal(cb.checked));
    sw.appendChild(cb); sw.appendChild(el("span",{class:"track"})); sw.appendChild(el("span",{class:"thumb"}));
    row.appendChild(sw);
    return row;
  }
  togglesCard.appendChild(el("div", {class:"section-title", style:"margin:0 0 4px;"}, [t("docOptions")]));
  togglesCard.appendChild(toggleRow("showOnHandCols", () => state.prefShowOnHandCols, v => { state.prefShowOnHandCols=v; }));
  togglesCard.appendChild(toggleRow("showPrice", () => state.prefShowPrice, v => { state.prefShowPrice=v; }));
  togglesCard.appendChild(toggleRow("showValues", () => state.prefShowValues, v => { state.prefShowValues=v; render(); }));
  togglesCard.appendChild(toggleRow("showTotal", () => state.prefShowTotal, v => { state.prefShowTotal=v; render(); }));
  content.appendChild(togglesCard);

  if(state.prefShowTotal){
    const tb = el("div", {class:"totalsbox"});
    const cEl = el("b",{}), pEl = el("b",{}), vEl = el("b",{});
    tb.appendChild(el("div", {class:"trow"}, [t("totalCartons"), cEl]));
    tb.appendChild(el("div", {class:"trow"}, [t("totalPieces"), pEl]));
    if(!state.hidePrices) tb.appendChild(el("div", {class:"trow grand"}, [t("grandTotal"), vEl]));
    content.appendChild(tb);
    repaintTotals = () => {
      const tot = cartTotals();
      cEl.textContent = fmtInt(tot.cartons);
      pEl.textContent = fmtInt(tot.pieces);
      vEl.textContent = fmtMoney(tot.value)+" "+curr();
    };
    repaintTotals();
  }

  const btnRow = el("div", {style:"display:flex;flex-direction:column;gap:8px;margin-top:4px;"});
  // On a phone the reliable way to get a PDF into WhatsApp is the native share sheet with
  // the file attached — so when that's supported it's the primary green action. Download
  // is always offered as a clean fallback (desktop, or saving a copy).
  if(canShareFiles()){
    btnRow.appendChild(el("button", {class:"btn btn-green btn-block", onclick: () => generateThen("share")}, [svgIcon("share"), " "+t("generateShare")]));
    btnRow.appendChild(el("button", {class:"btn btn-outline btn-block", onclick: () => generateThen("download")}, [svgIcon("download"), " "+t("downloadPdf")]));
  } else {
    btnRow.appendChild(el("button", {class:"btn btn-primary btn-block", onclick: () => generateThen("download")}, [svgIcon("download"), " "+t("downloadPdf")]));
  }
  content.appendChild(btnRow);

  s.appendChild(content);
  return s;
}

function saveOrderToHistory(store, orderId, totals, lines){
  try{
    const hist = JSON.parse(localStorage.getItem("oo_order_history") || "[]");
    hist.unshift({
      orderId, storeNo: store.storeNo, storeName: store.nameAr, date: new Date().toISOString(),
      cartons: totals.cartons, pieces: totals.pieces, value: totals.value,
      lineCount: lines.length
    });
    localStorage.setItem("oo_order_history", JSON.stringify(hist.slice(0, 200)));
  }catch(e){ /* storage full — non-fatal */ }
}

/* ---------------- PDF GENERATION ---------------- */
function canShareFiles(){
  try{ return !!(navigator.canShare && navigator.canShare({files:[new File(["x"], "x.pdf", {type:"application/pdf"})]})); }
  catch(e){ return false; }
}

// Build the PDF once, then either hand it to the native share sheet (WhatsApp etc.)
// or download it — the caller picks. Keeps a single generate path so the two buttons
// never diverge.
async function generateThen(action){
  const store = state.selectedStore;
  const onHandMap = OO.onHand[String(store.storeNo)] || {};
  const lines = Object.entries(state.cart).map(([art, ctn]) => {
    const sku = state.skusByArt[art];
    const oh = onHandMap[art];
    return { sku, oh, onHandPc: oh ? Number(oh.onHand)||0 : 0,
             cartons: ctn, pieces: ctn*sku.pcPerCs, value: ctn*sku.csPrice };
  }).filter(l => l.sku);
  if(lines.length === 0) return;
  lines.sort((a,b) => (a.sku.category||"").localeCompare(b.sku.category||"") || nameOf(a.sku).localeCompare(nameOf(b.sku)));

  showLoading(true);
  try{
    const orderId = "OO-"+new Date().toISOString().replace(/[-:T.]/g,"").slice(0,14);
    const _now = new Date();
    const dateStr = _now.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) + " · " + _now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    const {blob, filename} = await buildPdf({ store, lines, orderId, dateStr,
      showValues: state.prefShowValues, showTotal: state.prefShowTotal,
      showPrice: state.prefShowPrice, showOnHand: state.prefShowOnHandCols });
    state.lastPdf = {blob, filename};
    saveOrderToHistory(store, orderId, cartTotals(), lines);

    if(action === "share" && canShareFiles()){
      const file = new File([blob], filename, {type:"application/pdf"});
      showLoading(false);
      try{
        await navigator.share({ files:[file], title: t("poTitle"), text: t("poTitle")+" — "+store.nameAr+" #"+store.storeNo });
        return;
      }catch(e){
        if(e && e.name === "AbortError") return;  // user closed the share sheet
        // otherwise fall through to a download so they still get the file
      }
      showLoading(true);
    }
    downloadBlob(blob, filename);
    toast(t("orderId")+": "+orderId, "success");
  }catch(e){
    console.error(e);
    toast(t("genericErr"), "error");
  }finally{ showLoading(false); }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------------- EXCEL EXPORT (stock valuation, all stores) ---------------- */
// Builds one workbook: per-item value for every store, a store×category value matrix,
// brand roll-up, per-store summary, and a full line-level detail sheet. Value = on-hand
// pieces × PC price (same basis the app uses everywhere).
function exportStockWorkbook(){
  if(typeof XLSX === "undefined"){ toast(t("genericErr"), "error"); return; }
  showLoading(true);
  try{
    const round2 = (n) => Math.round((Number(n)||0)*100)/100;
    const cats = Object.keys(CATEGORY_META);              // stable category order for the matrix
    const stores = OO.stores.slice().sort((a,b) => String(a.region||"").localeCompare(String(b.region||"")) || a.storeNo-b.storeNo);

    // ---- Detail (every store × in-stock SKU) ----
    const detail = [["Store #","Store","Othaim Code","Zrep","Name (EN)","Name (AR)","Category","Brand","PC/Carton","On Hand (PC)","On Hand (CTN)","PC Price","Value (SAR)"]];
    const brandAgg = {};    // brand -> {pieces, value, skus}
    const catTotals = {};   // category -> value (grand, all stores)
    const storeRows = [];   // per-store summary
    let grandValue = 0, grandPieces = 0;

    stores.forEach(st => {
      const oh = OO.onHand[String(st.storeNo)] || {};
      const perCat = {};
      let sValue = 0, sPieces = 0, sSkus = 0;
      OO.skus.forEach(sku => {
        const rec = oh[sku.artecal]; if(!rec) return;
        const q = Number(rec.onHand)||0;
        const price = Number(sku.pcPrice)||0;
        const val = q * price;
        const cat = sku.category || "Uncategorized";
        const cs = ohCartons(q, sku.pcPerCs);
        detail.push([ st.storeNo, st.nameAr,
          codeStr(sku), sku.zrep||"", cleanName(sku.nameEn), arName(sku.nameAr), cat, sku.brand||"",
          Number(sku.pcPerCs)||0, q, cs?round2(cs.exact):0, round2(price), round2(val) ]);
        sValue += val; sPieces += q; sSkus++;
        perCat[cat] = (perCat[cat]||0) + val;
        catTotals[cat] = (catTotals[cat]||0) + val;
        const b = (sku.brand||"—");
        const ba = brandAgg[b] || (brandAgg[b] = {pieces:0, value:0, skus:0});
        ba.pieces += q; ba.value += val; ba.skus++;
      });
      grandValue += sValue; grandPieces += sPieces;
      storeRows.push({ st, sValue, sPieces, sSkus, perCat });
    });

    // ---- Sheet 1: Summary by store ----
    const summary = [["Store #","Store","Region","City","Salesman","SKUs in stock","On Hand (PC)","Stock Value (SAR)"]];
    storeRows.slice().sort((a,b)=> b.sValue-a.sValue).forEach(r => {
      summary.push([ r.st.storeNo, r.st.nameAr, r.st.region||"", r.st.city||"", r.st.salesman||"", r.sSkus, r.sPieces, round2(r.sValue) ]);
    });
    summary.push([]);
    summary.push(["TOTAL","","","","", "", grandPieces, round2(grandValue)]);

    // ---- Sheet 2: Store × Category value matrix ----
    const presentCats = cats.filter(c => catTotals[c] !== undefined);
    const catHead = ["Store #","Store"].concat(presentCats.map(c => CATEGORY_META[c].en)).concat(["Total (SAR)"]);
    const matrix = [catHead];
    storeRows.forEach(r => {
      const row = [r.st.storeNo, r.st.nameAr];
      let tot = 0;
      presentCats.forEach(c => { const v = r.perCat[c]||0; tot += v; row.push(round2(v)); });
      row.push(round2(tot));
      matrix.push(row);
    });
    const totRow = ["TOTAL",""]; let gt=0;
    presentCats.forEach(c => { totRow.push(round2(catTotals[c]||0)); gt += (catTotals[c]||0); });
    totRow.push(round2(gt));
    matrix.push([]); matrix.push(totRow);

    // ---- Sheet 3: By brand ----
    const brand = [["Brand","SKUs","On Hand (PC)","Stock Value (SAR)"]];
    Object.keys(brandAgg).sort((a,b)=> brandAgg[b].value-brandAgg[a].value).forEach(b => {
      brand.push([b, brandAgg[b].skus, brandAgg[b].pieces, round2(brandAgg[b].value)]);
    });
    brand.push([]); brand.push(["TOTAL","", grandPieces, round2(grandValue)]);

    // ---- Sheet 4: By category (overall) ----
    const catSheet = [["Category","Stock Value (SAR)","% of total"]];
    presentCats.slice().sort((a,b)=> (catTotals[b]||0)-(catTotals[a]||0)).forEach(c => {
      catSheet.push([CATEGORY_META[c].en, round2(catTotals[c]||0), grandValue? Math.round((catTotals[c]/grandValue)*1000)/10 + "%" : "0%"]);
    });
    catSheet.push([]); catSheet.push(["TOTAL", round2(grandValue), "100%"]);

    const wb = XLSX.utils.book_new();
    const mkSheet = (aoa, cols) => { const ws = XLSX.utils.aoa_to_sheet(aoa); if(cols) ws["!cols"] = cols; return ws; };
    XLSX.utils.book_append_sheet(wb, mkSheet(summary, [{wch:8},{wch:30},{wch:12},{wch:12},{wch:22},{wch:13},{wch:12},{wch:16}]), "Summary by Store");
    XLSX.utils.book_append_sheet(wb, mkSheet(matrix), "By Category (Store)");
    XLSX.utils.book_append_sheet(wb, mkSheet(catSheet, [{wch:22},{wch:16},{wch:12}]), "Category Totals");
    XLSX.utils.book_append_sheet(wb, mkSheet(brand, [{wch:28},{wch:8},{wch:13},{wch:16}]), "By Brand");
    XLSX.utils.book_append_sheet(wb, mkSheet(detail, [{wch:8},{wch:28},{wch:11},{wch:10},{wch:34},{wch:30},{wch:16},{wch:16},{wch:10},{wch:12},{wch:12},{wch:10},{wch:13}]), "Detail (All Items)");

    const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const stamp = new Date().toISOString().slice(0,10);
    downloadBlob(new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), "Othaim-Stock-Valuation-"+stamp+".xlsx");
    toast(t("exportDone"), "success");
  }catch(e){
    console.error(e);
    toast(t("genericErr"), "error");
  }finally{ showLoading(false); }
}

function groupByCategory(lines){
  const map = {};
  lines.forEach(l => { const c = l.sku.category||"Uncategorized"; (map[c] = map[c]||[]).push(l); });
  return map;
}

async function buildPdf({store, lines, orderId, dateStr, showValues, showTotal, showPrice, showOnHand}){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:"mm", format:"a4" });
  const grouped = groupByCategory(lines);
  const catKeys = Object.keys(grouped);

  const flat = [];
  catKeys.forEach(cat => {
    flat.push({ type:"cat", cat, count: grouped[cat].length });
    grouped[cat].forEach(l => flat.push({ type:"line", l }));
  });

  const ROWS_FIRST = 15, ROWS_NEXT = 20;
  const pages = [];
  let i = 0, first = true;
  while(i < flat.length){
    const cap = first ? ROWS_FIRST : ROWS_NEXT;
    pages.push(flat.slice(i, i+cap));
    i += cap; first = false;
  }
  if(pages.length === 0) pages.push([]);

  const totals = lines.reduce((a,l) => ({cartons:a.cartons+l.cartons, pieces:a.pieces+l.pieces, value:a.value+l.value}), {cartons:0,pieces:0,value:0});
  const isAr = state.lang === "ar";

  // html2canvas reads the LAYOUT direction from the live document root at capture time
  // (not from the element's own dir/CSS), so to force the sheet left-to-right in Arabic we
  // flip the root to LTR for the render and restore it right after. It's invisible: the
  // loading overlay is up and printRoot is off-screen. Arabic words still shape correctly.
  const rootEl = document.documentElement;
  const prevDir = rootEl.getAttribute("dir");
  rootEl.setAttribute("dir", "ltr");
  try{
    for(let p=0; p<pages.length; p++){
      const pageEl = buildPdfPageDom({
        store, orderId, dateStr, showValues, showTotal, showPrice, showOnHand, isAr,
        rows: pages[p], pageNum: p+1, totalPages: pages.length, isFirst: p===0,
        isLast: p===pages.length-1, totals
      });
      document.getElementById("printRoot").appendChild(pageEl);
      // scale 3 + lossless PNG → crisp text/lines at high resolution (no JPEG softening).
      const canvas = await html2canvas(pageEl, {scale:3, useCORS:true, backgroundColor:"#ffffff",
        onclone: (doc) => { doc.documentElement.setAttribute("dir","ltr"); }});
      const img = canvas.toDataURL("image/png");
      if(p>0) pdf.addPage();
      pdf.addImage(img, "PNG", 0, 0, 210, 297, undefined, "FAST");
      pageEl.remove();
    }
  } finally {
    if(prevDir) rootEl.setAttribute("dir", prevDir); else rootEl.removeAttribute("dir");
  }
  const filename = "Othaim-"+store.storeNo+"-"+orderId+".pdf";
  const blob = pdf.output("blob");
  return {blob, filename};
}

function buildPdfPageDom(o){
  // The printed sheet is ALWAYS left-to-right (items from the left, columns in the same
  // order) whatever the UI language — only the label text switches to Arabic. `arlang`
  // just tells the CSS not to letter-space Arabic labels.
  // dir="ltr" as an ATTRIBUTE (not just CSS) — html2canvas lays columns out by the dir
  // attribute, so this is what actually forces the sheet left-to-right in Arabic too.
  // The printed sheet is ALWAYS English + left-to-right (it is keyed into Othaim's English
  // system), whatever language the app UI is in. Arabic name is kept under the English one.
  const page = el("div", {class:"pdfpage ltr", dir:"ltr"});
  if(o.isFirst){
    const head = el("div", {class:"pdf-head"});
    head.appendChild(el("div", {class:"logo"}, [ el("img", {src:"data:image/png;base64,"+window.OTHAIM_LOGO_B64}) ]));
    const dt = el("div", {class:"doctitle"});
    dt.appendChild(el("span", {class:"kicker"}, [ "MARS  ·  " + CONFIG.VENDOR_CODE ]));
    dt.appendChild(el("h1",{},[ "Estimated Order" ]));
    dt.appendChild(el("div", {class:"docsub"}, [ E("poSub") ]));
    head.appendChild(dt);
    page.appendChild(head);
    page.appendChild(el("div", {class:"pdf-rule"}));

    const meta = el("div", {class:"pdf-meta"});
    const mk = (k,v,cls) => { const c = el("div",{class:"cell"+(cls?" "+cls:"")}); c.appendChild(el("div",{class:"k"},[E(k)])); c.appendChild(el("div",{class:"v"},[String(v)])); return c; };
    meta.appendChild(mk("store", o.store.nameAr, "store"));
    meta.appendChild(mk("storeNo", o.store.storeNo));
    meta.appendChild(mk("salesman", state.salesman||""));
    meta.appendChild(mk("date", o.dateStr));
    meta.appendChild(mk("orderId", o.orderId, "idcell"));
    page.appendChild(meta);
  } else {
    const mini = el("div", {style:"display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#8A909C;border-bottom:2px solid #067F3E;padding-bottom:10px;margin-bottom:14px;font-weight:700;letter-spacing:.2px;"});
    mini.appendChild(el("div", {style:"color:#13161B;font-weight:800;"}, [ "Estimated Order — "+o.store.nameAr+"  ·  #"+o.store.storeNo ]));
    mini.appendChild(el("div", {style:"font-family:'IBM Plex Mono',monospace;font-weight:600;"}, [ o.orderId ]));
    page.appendChild(mini);
  }

  // Column spec (English headers). On Hand is split into two clearly-labelled columns —
  // pieces and cartons — instead of one cramped stacked cell.
  const cols = [
    { head:"#", cls:"idx", get:(l,n) => String(n) },
    { head:"Item", cls:"name", get:(l) => {
        const en = cleanName(l.sku.nameEn), ar = arName(l.sku.nameAr);
        const primary = en || ar || ("#"+l.sku.artecal);
        const c = el("div"); c.appendChild(document.createTextNode(primary));
        if(en && ar) c.appendChild(el("div",{class:"ar", dir:"rtl"},[ar]));
        return c; } },
    { head:"Code", cls:"codecol", get:(l) => {
        const c = el("div");
        c.appendChild(el("div",{class:"oth"},[codeStr(l.sku)]));
        if(l.sku.zrep) c.appendChild(el("div",{class:"zr"},[ el("b",{},["ZR "]), String(l.sku.zrep) ]));
        return c; } },
    { head:"PC / Carton", cls:"packcol", get:(l) => fmtInt(l.sku.pcPerCs) }
  ];
  if(o.showOnHand){
    cols.push({ head:"On Hand (PC)", cls:"ohcol", get:(l) => fmtInt(l.onHandPc||0) });
    cols.push({ head:"On Hand (CTN)", cls:"ohcol", get:(l) => { const cs = ohCartons(l.onHandPc||0, l.sku.pcPerCs); return cs ? cs.text : "—"; } });
  }
  cols.push({ head:"Order (Cartons)", cls:"qtycol", get:(l) => fmtInt(l.cartons) });
  if(o.showPrice) cols.push({ head:"Carton Price", cls:"num", get:(l) => fmtMoney(l.sku.csPrice) });
  if(o.showValues) cols.push({ head:"Value", cls:"num", get:(l) => fmtMoney(l.value) });

  const table = el("table", {class:"pdf-table"+(cols.length >= 8 ? " tight" : "")});
  const thead = el("thead");
  const trh = el("tr");
  cols.forEach(c => trh.appendChild(el("th", {class:c.cls}, [c.head])));
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el("tbody");
  let n=0;
  o.rows.forEach(r => {
    if(r.type === "cat"){
      const m = catMeta(r.cat);
      const tr = el("tr", {class:"catrow"});
      const band = el("div", {class:"catband"}, [
        el("span", {class:"dot", style:"background:"+m.color}),
        el("span", {}, [m.en]),
        el("span", {class:"ct"}, [fmtInt(r.count)+" "+E("skuCount")])
      ]);
      tr.appendChild(el("td", {colspan: String(cols.length)}, [band]));
      tbody.appendChild(tr);
    } else {
      n++;
      const l = r.l;
      const tr = el("tr");
      cols.forEach(c => { const td = el("td", {class:c.cls}); const v = c.get(l, n); td.appendChild(typeof v === "string" ? document.createTextNode(v) : v); tr.appendChild(td); });
      tbody.appendChild(tr);
    }
  });
  table.appendChild(tbody);
  page.appendChild(table);

  if(o.isLast){
    const after = el("div", {class:"pdf-after"});
    const sign = el("div", {class:"pdf-sign"});
    sign.appendChild(el("div", {class:"box"}, [E("signRep")]));
    sign.appendChild(el("div", {class:"box"}, [E("signStore")]));
    after.appendChild(sign);
    if(o.showTotal){
      const tb = el("div", {class:"pdf-totals"});

// Pick one or more items and see, for each, the region total + Mars stock and a per-rep breakdown
// (each rep expandable to his own stores), with the stores that are out/low (sell-in gaps) flagged.
function renderRegionSearch(){
  const wrap = el("div", {class:"regionsearch"});
  const sel = [];  // selected artecals for this admin session

  // Group the region's stores by rep once.
  const repsMap = {};
  (OO.stores||[]).forEach(s => { const u=String(s.userNumber||"—"); (repsMap[u] = repsMap[u] || {user:u, name:s.salesman||("#"+u), stores:[]}).stores.push(s); });
  const repList = Object.values(repsMap);

  // Availability of one item across the whole region + per rep + per store.
  function itemStats(a){
    const mars = OO.marsStock[a] ? Number(OO.marsStock[a].qty)||0 : 0;
    let total=0, carrying=0, gaps=0, storeCount=0;
    const byRep = repList.map(r => {
      let rt=0, rc=0, rg=0; const stores=[];
      r.stores.forEach(s => {
        const rec = (OO.onHand[String(s.storeNo)] || {})[a];
        const q = rec ? Number(rec.onHand)||0 : 0;
        const gap = mars>0 && q <= state.gapThreshold;
        stores.push({no:s.storeNo, name:s.nameAr, oh:q, gap});
        rt+=q; if(q>0)rc++; if(gap)rg++;
        storeCount++; total+=q; if(q>0)carrying++; if(gap)gaps++;
      });
      return {user:r.user, name:r.name, count:r.stores.length, total:rt, carrying:rc, gaps:rg, stores};
    });
    return {mars, total, carrying, gaps, storeCount, byRep};
  }
  const pill = (lbl, val, tone) => el("div", {class:"rs-pill "+tone}, [ el("span",{class:"rs-pl"},[lbl]), el("span",{class:"rs-pv"},[val]) ]);

  const inp = el("input", {class:"input", placeholder:t("regionSearchPlaceholder")});
  wrap.appendChild(el("div", {class:"searchbox"}, [svgIcon("search"), inp]));
  // Shared opportunity threshold (same one the reps use): tune what counts as a gap here too.
  const thr = el("div", {class:"gapthresh rs-thr"});
  function drawThr(){ thr.innerHTML=""; thr.appendChild(el("span",{class:"gt-cap"},[t("gapThreshLabel")]));
    [0,1,2,3].forEach(n=>thr.appendChild(el("button",{class:"gt-opt"+(state.gapThreshold===n?" on":""),
      onclick:()=>{ state.gapThreshold=n; try{localStorage.setItem("oo_gapThreshold",String(n));}catch(e){} drawThr(); drawOut(); }},[String(n)]))); }
  wrap.appendChild(thr);
  const results = el("div", {class:"rs-results"}); wrap.appendChild(results);
  const chips = el("div", {class:"rs-chips"}); wrap.appendChild(chips);
  const out = el("div", {class:"rs-out"}); wrap.appendChild(out);

  function drawResults(){
    results.innerHTML = "";
    const q = inp.value.trim().toLowerCase();
    if(!q) return;
    const hits = OO.skus.filter(sk => !sel.includes(sk.artecal) && (
      String(sk.artecal).includes(q) || codeStr(sk).includes(q) || String(sk.zrep).includes(q) ||
      (sk.nameAr||"").toLowerCase().includes(q) || (sk.nameEn||"").toLowerCase().includes(q))).slice(0,12);
    if(!hits.length){ results.appendChild(el("div",{class:"rs-none"},[t("catNoLines")])); return; }
    hits.forEach(sk => results.appendChild(el("div", {class:"rs-hit", onclick:()=>{ sel.push(sk.artecal); inp.value=""; drawResults(); drawChips(); drawOut(); }}, [
      el("span",{class:"rs-hit-code"},[codeStr(sk)]),
      el("span",{class:"rs-hit-name"},[cleanName(sk.nameEn)||arName(sk.nameAr)||("#"+sk.artecal)]),
      el("span",{class:"rs-hit-add"},["＋"])
    ])));
  }
  function drawChips(){
    chips.innerHTML = "";
    sel.forEach(a => { const sk=state.skusByArt[a];
      chips.appendChild(el("span", {class:"rs-chip"}, [
        el("span",{class:"rs-chip-t"},[sk?(cleanName(sk.nameEn)||arName(sk.nameAr)):("#"+a)]),
        el("button",{class:"rs-x", onclick:()=>{ const i=sel.indexOf(a); if(i>=0) sel.splice(i,1); drawChips(); drawOut(); }},["✕"])
      ]));
    });
  }
  function drawOut(){
    out.innerHTML = "";
    if(!sel.length){ out.appendChild(el("div", {class:"rs-empty"}, [t("regionEmptyHint")])); return; }
    sel.forEach(a => {
      const sk = state.skusByArt[a]; const st = itemStats(a);
      const card = el("div", {class:"rs-card"});
      const h = el("div", {class:"rs-h"});
      h.appendChild(el("div", {class:"rs-h-name"}, [sk?(cleanName(sk.nameEn)||arName(sk.nameAr)):("#"+a)]));
      h.appendChild(el("span", {class:"rs-h-code"}, [sk?codeStr(sk):String(a)]));
      card.appendChild(h);
      const sum = el("div", {class:"rs-sum"});
      sum.appendChild(pill(t("regionTotal"), fmtInt(st.total), "blue"));
      sum.appendChild(pill(t("marsStock"), fmtInt(st.mars), "green"));
      sum.appendChild(pill(t("carryingStores"), fmtInt(st.carrying)+"/"+fmtInt(st.storeCount), "ink"));
      sum.appendChild(pill(t("gapStores"), fmtInt(st.gaps), "amber"));
      card.appendChild(sum);
      const reps = el("div", {class:"rs-reps"});
      st.byRep.slice().sort((x,y)=> y.gaps-x.gaps || y.total-x.total).forEach(r => {
        const row = el("div", {class:"rs-rep"});
        const head = el("div", {class:"rs-rep-h", onclick:()=>{ row.classList.toggle("open"); head.querySelector(".rs-chev").textContent = row.classList.contains("open")?"▴":"▾"; }});
        const nm = el("div", {class:"rs-rep-l"});
        nm.appendChild(el("span",{class:"rs-rep-name"},[r.name]));
        const b = el("div", {class:"rs-rep-b"});
        b.appendChild(el("span",{class:"rs-b total"},[t("onHand")+" "+fmtInt(r.total)]));
        b.appendChild(el("span",{class:"rs-b carry"},[fmtInt(r.carrying)+"/"+fmtInt(r.count)]));
        if(r.gaps) b.appendChild(el("span",{class:"rs-b gap"},["🎯 "+fmtInt(r.gaps)]));
        nm.appendChild(b);
        head.appendChild(nm);
        head.appendChild(el("span",{class:"rs-chev"},["▾"]));
        row.appendChild(head);
        const body = el("div", {class:"rs-rep-body"});
        r.stores.slice().sort((x,y)=> (x.gap===y.gap ? x.oh-y.oh : (x.gap?-1:1))).forEach(s => {
          body.appendChild(el("div", {class:"rs-store"+(s.gap?" gap":"")}, [
            el("span",{class:"rs-store-name"},[s.name]),
            el("span",{class:"rs-store-oh"},[fmtInt(s.oh)])
          ]));
        });
        row.appendChild(body);
        reps.appendChild(row);
      });
      card.appendChild(reps);
      out.appendChild(card);
    });
  }
  inp.addEventListener("input", ()=>{ clearTimeout(inp._t); inp._t=setTimeout(drawResults, 120); });
  drawThr(); drawOut();
  return wrap;
}

/* ---- parse an uploaded workbook, auto-detecting raw export vs clean template ---- */
function sheetRows(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {defval:""});
}
// Fast array-of-arrays read (no per-row objects) — used for the huge On Hand sheet.
function sheetAoA(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
}
// Index of the first header cell matching any pattern.
function colIdx(header, patterns){
  for(const re of patterns){
    const i = header.findIndex(h => re.test(String(h).trim()));
    if(i >= 0) return i;
  }
  return -1;
}
function leadCode(s){
  if(s === undefined || s === null || s === "") return null;
  const m = String(s).match(/^\s*0*(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
// Tolerant number: strips thousands separators / spaces / stray chars so "1,234" or " 12 " parse.
function num(v){
  if(v === undefined || v === null || v === "") return 0;
  if(typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v).trim();
  const neg = /^\(.*\)$/.test(s);   // accounting negatives shown as (10)
  s = s.replace(/[,\s٬،]/g, "").replace(/[^0-9.\-]/g, "");
  let n = Number(s);
  if(!isFinite(n)) return 0;
  return neg ? -Math.abs(n) : n;
}
// Find the first column whose header matches any of the given patterns (trimmed, case-insensitive).
function findCol(row, patterns){
  const keys = Object.keys(row || {});
  for(const re of patterns){
    const k = keys.find(k => re.test(String(k).trim()));
    if(k) return k;
  }
  return null;
}
function leadCodeStr(s, width){
  width = width || 6;
  if(s === undefined || s === null || s === "") return null;
  let m = String(s).match(/^\s*(\d+)\s*-/);
  if(m) return m[1];
  m = String(s).match(/^\s*0*(\d+)/);
  return m ? m[1].padStart(width, "0") : null;
}
// Some raw Mars/D365 exports have TWO similarly-named English-description columns:
// one genuinely bogus (just the leading item code, no real text) and one with the
// actual English product name. Scan every "Description English"-ish / blank-header
// column and use the first one that looks like a real name rather than a bare code.
function isBogusName(v){
  if(v === undefined || v === null) return true;
  const s = String(v).trim();
  return s === "" || /^0*\d+\s*-?\s*$/.test(s);
}
function bestEnName(r){
  const keys = Object.keys(r);
  for(const k of keys){
    if(/description\s*english/i.test(k) || /^__EMPTY/i.test(k) || /^unnamed/i.test(k)){
      const v = r[k];
      if(!isBogusName(v)) return String(v).trim();
    }
  }
  return "";
}
function parseWorkbook(wb){
  const out = {};

  // ---- Stores ----
  let storeRows = sheetRows(wb, "Stores");
  if(storeRows){
    out.stores = storeRows.filter(r => r.UserNumber !== undefined && r.UserNumber !== "").map(r => ({
      storeNo: Number(r.StoreNo), nameAr: r.StoreNameAR, region: r.Region, city: r.City,
      salesman: r.Salesman, userNumber: String(r.UserNumber)
    }));
  } else {
    const raw = sheetRows(wb, "Store");
    if(raw){
      out.stores = raw.filter(r => r["Salesman"] && r["User number"]).map(r => ({
        storeNo: Number(r["Store #"]),
        nameAr: String(r["Store Arabic Name With Number"]||"").replace(/^\s*0*\d+\s*-\s*/,""),
        region: r["Region"], city: r["City"], salesman: r["Salesman"], userNumber: String(r["User number"])
      }));
    }
  }

  // ---- SKUs ----
  let skuRows = sheetRows(wb, "SKUs");
  if(skuRows){
    out.skus = skuRows.map(r => {
      const pcPerCs = Number(r.PCperCS)||0;
      let pcPrice = Number(r.PCPrice)||0, csPrice = Number(r.CSPrice)||0;
      // Piece price and carton price are related by pack size (carton = piece × pieces-per-carton).
      // Derive whichever is missing so stock/order valuation is never zero when the other is present.
      if(pcPrice <= 0 && csPrice > 0 && pcPerCs > 0) pcPrice = Math.round((csPrice/pcPerCs)*10000)/10000;
      else if(csPrice <= 0 && pcPrice > 0 && pcPerCs > 0) csPrice = Math.round((pcPrice*pcPerCs)*100)/100;
      return {
        artecal: Number(r.ArtecalNo), artecalCode: r.ArtecalCode ? String(r.ArtecalCode) : String(Number(r.ArtecalNo)).padStart(6,"0"),
        zrep: Number(r.ZrepCode)||0, nameAr: r.NameAR, nameEn: r.NameEN,
        category: r.Category || "Uncategorized", brand: r.Brand || "",
        pcPerCs, pcPrice, csPrice
      };
    });
  } else {
    const raw = sheetRows(wb, "SKU Data");
    if(raw){
      // Header names in raw D365/Mars exports drift — the real file ships " PC Price " and
      // " SB Price " with stray spaces while "CS Price" has none, so an exact r["PC Price"]
      // lookup silently returns undefined and every piece price becomes 0 (→ zero stock value).
      // Locate the price/pack columns ONCE by trimmed, case-insensitive match instead.
      const sample = raw[0] || {};
      const kPer   = findCol(sample, [/^pc\s*per\s*cs$/i, /pc.*per.*cs/i, /per\s*cs/i, /units?\s*per\s*(case|carton|cs)/i, /pack\s*size/i]);
      const kPcP   = findCol(sample, [/^pc\s*price$/i, /piece\s*price/i, /unit\s*price/i]);
      const kCsP   = findCol(sample, [/^cs\s*price$/i, /case\s*price/i, /carton\s*price/i]);
      const kZrep  = findCol(sample, [/^zrep\s*co?od$/i, /zrep/i]);
      const kCat   = findCol(sample, [/^category$/i, /category|فئة|تصنيف/i]);
      const kBrand = findCol(sample, [/^brand$/i, /brand|علامة|براند/i]);
      out.skus = raw.map(r => {
        const art = leadCode(r["Artecal#"]);
        const artCode = leadCodeStr(r["Item Arabic Description With Number"]) || (art!==null ? String(art).padStart(6,"0") : "");
        const nameAr = String(r["Item Arabic Description With Number"]||"").replace(/^\s*0*\d+\s*-\s*/,"");
        const cat = (kCat && r[kCat]) || inferCategory(nameAr) || "Uncategorized";
        const pcPerCs = kPer ? num(r[kPer]) : 0;
        let pcPrice = kPcP ? num(r[kPcP]) : 0, csPrice = kCsP ? num(r[kCsP]) : 0;
        // Piece price and carton price are related by pack size — derive whichever is missing so
        // stock/order valuation is never zero when the other price is present (permanent safety net).
        if(pcPrice <= 0 && csPrice > 0 && pcPerCs > 0) pcPrice = Math.round((csPrice/pcPerCs)*10000)/10000;
        else if(csPrice <= 0 && pcPrice > 0 && pcPerCs > 0) csPrice = Math.round((pcPrice*pcPerCs)*100)/100;
        return {
          artecal: art, artecalCode: artCode, zrep: (kZrep ? Number(r[kZrep]) : 0)||0, nameAr,
          nameEn: bestEnName(r),
          category: cat, brand: (kBrand && r[kBrand]) || "",
          pcPerCs, pcPrice, csPrice
        };
      }).filter(x => x.artecal);
    }
  }

  // ---- OnHand ----
  // Read fast (array mode), locate columns by header pattern (handles the clean template AND
  // the raw D365 export, whose headers drift), and SCOPE to assigned stores only — his raw
  // file carries all ~474 stores (83k rows) but the app only needs the ~72 assigned ones, so
  // scoping keeps the rebuilt file small and quick.
  {
    let sheetName = wb.Sheets["OnHand"] ? "OnHand" : (wb.Sheets["On Hand Quantity"] ? "On Hand Quantity" : null);
    if(!sheetName) sheetName = (wb.SheetNames||[]).find(n => /on.?hand|الموجود|رصيد/i.test(n));
    const aoa = sheetName ? sheetAoA(wb, sheetName) : null;
    if(aoa && aoa.length > 1){
      const H = aoa[0];
      const si = colIdx(H, [/store.*(arabic|name|#)/i, /^store\b/i, /storeno/i, /اسم.*متجر|المتجر|متجر/]);
      const ii = colIdx(H, [/item.*(arabic|description)/i, /artecal/i, /اسم.*صنف|الصنف|المنتج|رقم.*صنف/]);
      const oi = colIdx(H, [/on.?hand.*(qty|quantity)/i, /quantity.*on.?hand/i, /onhandpc/i, /^on.?hand$/i, /الموجود/, /رصيد/, /متاح/]);
      const mi = colIdx(H, [/min.*(qty|quantity)/i, /minimum/i, /minqty/i, /أدنى|ادنى/]);
      const xi = colIdx(H, [/max.*(qty|quantity)/i, /maximum/i, /maxqty/i, /أقصى|اقصى/]);
      const li = colIdx(H, [/last.*sold/i, /lastsold/i, /آخر.*بيع/]);
      // scope: assigned stores = freshly-uploaded stores if present, else the current ones
      const keep = {};
      (out.stores || OO.stores || []).forEach(s => { const n = leadCode(s.storeNo); if(n!==null) keep[n] = 1; });
      const useScope = Object.keys(keep).length > 0;
      const map = {};
      for(let r=1; r<aoa.length; r++){
        const row = aoa[r];
        const s = leadCode(row[si]); if(s === null) continue;
        if(useScope && !keep[s]) continue;
        const a = leadCode(row[ii]); if(a === null) continue;
        (map[s] = map[s]||{})[a] = {
          onHand: oi>=0 ? num(row[oi]) : 0,
          min: mi>=0 ? num(row[mi]) : 0,
          max: xi>=0 ? num(row[xi]) : 0,
          lastSold: li>=0 ? String(row[li]||"") : ""
        };
      }
      out.onHand = map;
      out._onHandCols = { store:H[si], item:H[ii], onHand:oi>=0?H[oi]:"(not found)" };
    }
  }

  // ---- Mars Stock ----
  let msRows = sheetRows(wb, "MarsStock");
  if(msRows){
    const map = {};
    msRows.forEach(r => { map[String(r.ArtecalNo)] = {qty:Number(r.MarsStockQty)||0, updated:String(r.DateCreated||"")}; });
    out.marsStock = map;
  } else {
    const raw = sheetRows(wb, "Mars Stock");
    if(raw){
      const map = {};
      raw.forEach(r => {
        const z = Number(r["ZREP"]);
        if(!z) return;
        map[String(z)] = {qty:Number(r["Mars Stock"])||0, updated:String(r["Date Created"]||""), _zrep:true};
      });
      out.marsStock = map;
      out._marsStockByZrep = true;
    }
  }

  return out;
}

// Overall stock snapshot across ALL of the manager's stores (value + pieces).
function overallTotals(data){
  let value=0, pieces=0; const sk={}; (data.skus||[]).forEach(s=>sk[s.artecal]=s);
  Object.values(data.onHand||{}).forEach(items=>{ for(const art in items){ const q=Number(items[art].onHand)||0; pieces+=q; const s=sk[art]; if(s) value+=q*(Number(s.pcPrice)||0); } });
  return {value, pieces};
}

// Apply an uploaded workbook to the app IMMEDIATELY (no extra "build" click): merge the sheets it
// contains, refresh every number live, persist on this device, and show a clear "done" card with
// before -> after totals. Downloading index.html for GitHub is a separate button on that card.
// Stable, order-independent fingerprint of one data section — used to detect whether a section
// ACTUALLY changed on upload, so a section's time/date only moves when its own data really changed
// (upload a file where only On Hand changed → only the On Hand timestamp updates).
function sectionSig(kind, data){
  if(!data) return "";
  if(kind==="stores") return (data||[]).map(s=>[leadCode(s.storeNo),s.userNumber,s.nameAr,s.salesman,s.nameEn].join("|")).sort().join("¶");
  if(kind==="skus")   return (data||[]).map(s=>[s.artecal,s.pcPrice,s.csPrice,s.pcPerCs,s.category,s.brand,s.nameEn,s.nameAr,s.zrep].join("|")).sort().join("¶");
  if(kind==="onHand"){
    const parts=[];
    Object.keys(data).sort().forEach(st=>{ const it=data[st]||{};
      parts.push(st+":"+Object.keys(it).sort().map(a=>a+"="+(Number(it[a].onHand)||0)+","+(Number(it[a].min)||0)+","+(Number(it[a].max)||0)).join(";")); });
    return parts.join("¶");
  }
  if(kind==="marsStock") return Object.keys(data).sort().map(a=>a+"="+(Number(data[a].qty)||0)).join(";");
  return "";
}
function applyUpload(parsed, summaryEl){
  const now = nowStamp();   // local Saudi time, not UTC
  const before = overallTotals(OO);
  const merged = JSON.parse(JSON.stringify(OO)); // clone current data
  const present = ["stores","skus","onHand","marsStock"].filter(k => parsed[k]);
  const applied = [], skipped = [], changedSections = [];
  // Bump a section's timestamp ONLY if its data differs from what's already loaded.
  const stamp = (kind, oldData, newData, metaKey) => {
    if(sectionSig(kind, oldData) !== sectionSig(kind, newData)){ merged.meta[metaKey] = now; changedSections.push(kind); }
  };
  // SAFETY NET: never let an empty/corrupted sheet wipe good data already in the app.
  if(present.includes("stores")){ if(parsed.stores && parsed.stores.length){ stamp("stores", OO.stores, parsed.stores.filter(st=>st.userNumber), "lastUpdatedStores"); merged.stores=parsed.stores; applied.push("Stores"); } else skipped.push("Stores"); }
  if(present.includes("skus")){ if(parsed.skus && parsed.skus.length){ stamp("skus", OO.skus, parsed.skus, "lastUpdatedSKUs"); merged.skus=parsed.skus; applied.push("SKUs"); } else skipped.push("SKUs"); }
  if(present.includes("onHand")){ if(parsed.onHand && Object.keys(parsed.onHand).length){ stamp("onHand", OO.onHand, parsed.onHand, "lastUpdatedOnHand"); merged.onHand=parsed.onHand; applied.push("OnHand"); } else skipped.push("OnHand"); }
  if(present.includes("marsStock") && parsed.marsStock && Object.keys(parsed.marsStock).length){
    let ms=parsed.marsStock;
    if(Object.values(ms)[0] && Object.values(ms)[0]._zrep){
      const z2a={}; merged.skus.forEach(sk=>{ if(sk.zrep) z2a[String(sk.zrep)]=sk.artecal; });
      const rem={}; Object.entries(ms).forEach(([z,v])=>{ const a=z2a[z]; if(a) rem[String(a)]={qty:v.qty,updated:v.updated}; }); ms=rem;
    }
    stamp("marsStock", OO.marsStock, ms, "lastUpdatedMarsStock"); merged.marsStock=ms; applied.push("MarsStock");
  } else if(present.includes("marsStock")) skipped.push("MarsStock");

  if(applied.length === 0){ toast(t("buildAllEmpty"), "error"); return; }

  // Collect concrete on-hand changes (store . item . before -> after) + count, before swapping in.
  const changeSamples=[]; let changed=0;
  if(parsed.onHand){
    const skById={}; (merged.skus||[]).forEach(s=>skById[s.artecal]=s);
    const stById={}; (merged.stores||[]).forEach(s=>stById[String(leadCode(s.storeNo))]=s);
    for(const st of Object.keys(parsed.onHand)){
      const oldItems=(OO.onHand&&OO.onHand[st])||{};
      for(const art of Object.keys(parsed.onHand[st])){
        const nv=Number(parsed.onHand[st][art].onHand)||0, ov=Number((oldItems[art]||{}).onHand)||0;
        if(nv!==ov){ changed++;
          if(changeSamples.length<6){ const sk=skById[art], store=stById[String(st)];
            changeSamples.push({store:st, item:(sk?(sk.nameEn||sk.nameAr):art), before:ov, after:nv}); } }
      }
    }
  }

  // ---- NEW / REMOVED items diff (per store + brand-new SKUs) — powers the "what's new" report ----
  if(parsed.onHand && Object.keys(parsed.onHand).length){
    const oldByStore = {}, newByStore = {}, oldGlobal = new Set(), newGlobal = new Set();
    Object.entries(OO.onHand||{}).forEach(([st,items])=>{ const s=new Set(Object.keys(items||{})); oldByStore[st]=s; s.forEach(a=>oldGlobal.add(a)); });
    Object.entries(parsed.onHand).forEach(([st,items])=>{ const s=new Set(Object.keys(items||{})); newByStore[st]=s; s.forEach(a=>newGlobal.add(a)); });
    const newSkus=[]; newGlobal.forEach(a=>{ if(!oldGlobal.has(a)) newSkus.push(a); });
    const byStore={};
    new Set([...Object.keys(oldByStore),...Object.keys(newByStore)]).forEach(st=>{
      const o=oldByStore[st]||new Set(), n=newByStore[st]||new Set(), added=[], removed=[];
      n.forEach(a=>{ if(!o.has(a)) added.push(a); });
      o.forEach(a=>{ if(!n.has(a)) removed.push(a); });
      if(added.length||removed.length) byStore[st]={added,removed};
    });
    merged.meta.lastDiff = { at: now, newSkus, byStore };
  }

  merged.stores = merged.stores.filter(st => st.userNumber);
  merged.meta.builtAt = now;              // this upload is now the newest data version
  OO = merged; reindexSkus();             // refresh every number live (clears the value cache)
  const after = overallTotals(OO);

  // Persist on THIS device so a reload/reopen keeps the new numbers (never reverts to baked).
  try{ localStorage.setItem(LS_DATA_KEY, encodeEmbeddedData(OO)); localStorage.setItem(LS_DATA_BUILT, now); }catch(e){}
  if(skipped.length) toast(t("buildKept")+": "+skipped.join(", "), "warn");

  // ---- result card ----
  summaryEl.style.display="flex"; summaryEl.innerHTML="";
  const box = el("div", {class:"buildok"});
  box.appendChild(el("div", {class:"okttl"}, [t("updateDoneTitle")]));
  const noChange = (changed === 0);
  const ba = el("div", {class:"okba"});
  const baRow = (lbl, beforeTxt, afterTxt) => el("div",{class:"okba-row"},[
    el("span",{class:"okba-lbl"},[lbl]),
    el("span",{class:"okba-val", dir:"ltr"},[ beforeTxt, el("span",{class:"okba-arrow"},[" → "]), el("b",{},[afterTxt]) ])
  ]);
  if(!state.hidePrices) ba.appendChild(baRow(t("stockValueTotal"), fmtMoney(before.value), fmtMoney(after.value)+" "+curr()));
  ba.appendChild(baRow(t("onHandPieces"), fmtInt(before.pieces), fmtInt(after.pieces)));
  ba.appendChild(el("div",{class:"okba-row"},[ el("span",{class:"okba-lbl"},[t("changedEntries")]), el("span",{class:"okba-val"},[el("b",{},[fmtInt(changed)])]) ]));
  box.appendChild(ba);
  if(noChange){ const nd=el("div",{class:"nodiff"}); nd.appendChild(el("div",{class:"ndttl"},["ℹ️ "+t("noDiffTitle")])); nd.appendChild(el("div",{class:"ndmsg"},[t("noDiffMsg")])); box.appendChild(nd); }
  if(changeSamples.length){
    const ch=el("div",{class:"okchanges"}); ch.appendChild(el("div",{class:"okchttl"},[t("changesTitle")]));
    changeSamples.forEach(c=>ch.appendChild(el("div",{class:"okchrow"},[ el("span",{class:"okchname"},[c.item+"  ·  #"+c.store]), el("span",{class:"okchval", dir:"ltr"},[fmtInt(c.before)+" → ", el("b",{},[fmtInt(c.after)])]) ])));
    box.appendChild(ch);
  }
  // NEW ITEMS Othaim added (brand-new SKUs in On Hand vs last update) — professional summary for the manager.
  const newSkus = (OO.meta && OO.meta.lastDiff && OO.meta.lastDiff.newSkus) || [];
  if(newSkus.length){
    const ni = el("div",{class:"newitems"});
    const h = el("div",{class:"ni-head"});
    h.appendChild(el("div",{class:"ni-title"},[t("newItemsTitle")]));
    h.appendChild(el("span",{class:"ni-count"},[fmtInt(newSkus.length)]));
    ni.appendChild(h);
    ni.appendChild(el("div",{class:"ni-note"},[t("newItemsNote")]));
    const list = el("div",{class:"ni-list"});
    newSkus.slice(0,80).forEach(a=>{ const sk=state.skusByArt[a];
      list.appendChild(el("div",{class:"ni-item"},[
        el("span",{class:"ni-code"},[sk?sk.artecalCode:String(a)]),
        el("span",{class:"ni-name"},[sk?(cleanName(sk.nameEn)||arName(sk.nameAr)||("#"+a)):("#"+a)])
      ]));
    });
    if(newSkus.length>80) list.appendChild(el("div",{class:"login-sub",style:"padding:6px 2px;"},["+"+fmtInt(newSkus.length-80)]));
    ni.appendChild(list);
    box.appendChild(ni);
  }
  // PRIMARY: publish live to every rep via Firebase (no GitHub, no password — auto anonymous sign-in).
  const pubNote = el("div",{class:"login-sub",style:"margin-top:6px;line-height:1.7;"});
  const pubBtn = el("button",{class:"btn btn-primary btn-block",style:"margin-top:12px;",onclick:async()=>{
    pubNote.textContent = t("publishAutoTry");
    const ok = await publishToFirebase();
    pubNote.textContent = ok ? ("✅ "+t("publishedLiveOk")) : t("publishManualHint");
  }},[svgIcon("refresh"), " "+t("publishLive")]);
  box.appendChild(pubBtn);
  box.appendChild(pubNote);
  // Live sync ready → publish to the reps automatically right now (no button press needed).
  if(fbReady){
    pubNote.textContent = t("publishAutoTry");
    publishToFirebase().then(ok=>{ pubNote.textContent = ok ? ("✅ "+t("publishedLiveOk")) : t("publishManualHint"); });
  } else {
    pubNote.textContent = t("fbNotConfigured");
  }
  // Preview the updated stores live.
  box.appendChild(el("button",{class:"btn btn-outline btn-block",style:"margin-top:10px;",onclick:()=>{ state.user="__preview__"; state.salesman=t("previewLabel"); state.stores=(OO.stores||[]).slice(); state.screen="stores"; state.category="all"; state.query=""; render(); }},[t("previewStores")]));
  // Backup path (only needed for code changes, or if live sync is off): download index.html for GitHub.
  box.appendChild(el("button",{class:"btn btn-green btn-block",style:"margin-top:8px;",onclick:()=>downloadIndexHtml()},[svgIcon("download"), " "+t("downloadForGithub")]));
  box.appendChild(el("div",{class:"login-sub",style:"margin-top:6px;line-height:1.7;"},[t("deployHint")]));
  box.appendChild(el("button",{class:"btn btn-outline btn-block",style:"margin-top:8px;",onclick:()=>{ summaryEl.style.display="none"; summaryEl.innerHTML=""; }},[t("buildAgain")]));
  summaryEl.appendChild(box);
  toast(t("updateDoneTitle"), "success");
}

// Build and download the updated index.html (the file the manager re-uploads to GitHub for reps).
function downloadIndexHtml(){
  try{
    const blob64 = encodeEmbeddedData(OO);
    const newHtml = ORIGINAL_HTML.replace(/(<script id="oo-data"[^>]*>)[\s\S]*?(<\/script>)/, "$1"+blob64+"$2");
    const blob = new Blob([newHtml], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    toast(t("downloadStarted"), "success");
  }catch(e){ console.error(e); toast(t("genericErr"), "error"); }
}

function saveHist(hist){ try{ localStorage.setItem("oo_order_history", JSON.stringify(hist)); }catch(e){} }
function renderOrderHistory(){
  const wrap = el("div", {class:"histlist"});
  let hist = [];
  try{ hist = JSON.parse(localStorage.getItem("oo_order_history")||"[]"); }catch(e){}
  if(hist.length === 0){ wrap.appendChild(el("div",{class:"emptystate"},[t("noMyOrders")])); return wrap; }
  // Header: count + one button to clear the whole saved history on this device.
  const hdr = el("div", {class:"histhdr"});
  hdr.appendChild(el("span", {class:"histcount"}, [ fmtInt(hist.length)+" "+t("ordersWord") ]));
  hdr.appendChild(el("button", {class:"histclear", onclick:() => {
    if(confirm(t("confirmClearHist"))){ localStorage.removeItem("oo_order_history"); render(); }
  }}, [ svgIcon("trash"), el("span",{},[t("clearHistory")]) ]));
  wrap.appendChild(hdr);
  hist.slice(0,30).forEach(o => {
    const box = el("div", {class:"orderlogitem"});
    const top = el("div", {class:"top"});
    top.appendChild(el("span",{},[o.storeName+" · #"+o.storeNo]));
    top.appendChild(el("span",{},[fmtMoney(o.value)+" "+curr()]));
    box.appendChild(top);
    const subrow = el("div", {class:"subrow"});
    subrow.appendChild(el("div",{class:"sub"},[ o.orderId+" · "+new Date(o.date).toLocaleString() ]));
    // Per-order delete.
    subrow.appendChild(el("button", {class:"delx", title:t("delete"), "aria-label":t("delete"), onclick:() => {
      let h2 = []; try{ h2 = JSON.parse(localStorage.getItem("oo_order_history")||"[]"); }catch(e){}
      saveHist(h2.filter(x => x.orderId !== o.orderId));
      render();
    }}, ["×"]));
    box.appendChild(subrow);
    wrap.appendChild(box);
  });
  return wrap;
}

/* ---------------- BOOT ---------------- */
let ORIGINAL_HTML = null;
(function boot(){
  ORIGINAL_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  OO = loadLiveData();   // newest of baked vs last build saved on this device
  reindexSkus();
  applyViewport();
  restoreSession();      // land back where we were (Refresh / reopen), not on the login screen
  render();
  // Live data sync (no-op if the Firebase SDK didn't load — the app keeps its baked/local data).
  initFirebase();
  syncFromFirebase();
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();

</script>
