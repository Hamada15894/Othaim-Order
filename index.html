<style>
:root{
  --red:#E2000A; --red-dark:#B4000A; --green:#067F3E; --green-light:#9DC418;
  --ink:#15181D; --ink-soft:#3A3F49; --muted:#767C88; --line:#E4E6EB; --line-soft:#EFF0F3;
  --bg:#F4F5F7; --paper:#FFFFFF; --amber:#B4740A; --danger:#C0281F;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 20px -8px rgba(20,22,28,.12);
  --font-ar:'Cairo',system-ui,sans-serif; --font-en:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);}
body{font-family:var(--font-ar);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
html[data-lang="en"] body{font-family:var(--font-en);}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:rgba(226,0,10,.18);}
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);letter-spacing:.2px;}

/* ---------- layout shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);position:relative;}
.screen{display:flex;flex-direction:column;flex:1;min-height:100vh;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.topbar .brandmark{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.topbar .brandmark img{height:26px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px;}
.topbar .titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.topbar .t1{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .t2{font-size:11px;color:#B7BCC7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;}
.iconbtn:hover{background:rgba(255,255,255,.16);}
.iconbtn svg{width:18px;height:18px;}
.langpill{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px;flex-shrink:0;gap:2px;}
.langpill button{border:none;background:transparent;color:#B7BCC7;font-weight:800;font-size:11.5px;padding:6.5px 8px;border-radius:6px;cursor:pointer;line-height:1;min-width:26px;}
.langpill button.active{background:#fff;color:var(--ink);}
.cartbtn{position:relative;}
.cartbadge{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---------- status strip ---------- */
.statusstrip{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);}
.statusstrip .cell{flex:1;padding:7px 12px;display:flex;flex-direction:column;gap:1px;border-inline-end:1px solid var(--line-soft);}
.statusstrip .cell b{color:var(--ink-soft);font-size:11.5px;font-weight:700;}
.statusstrip .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-inline-end:5px;}
.dot-fresh{background:var(--green);} .dot-warn{background:var(--amber);} .dot-stale{background:var(--danger);}
.statusstrip .refresh{width:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;}
.statusstrip .refresh svg{width:15px;height:15px;}

/* ---------- generic content padding ---------- */
.content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;}
.center-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px;}

/* ---------- buttons ---------- */
.btn{appearance:none;border:none;border-radius:10px;padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, opacity .15s, background .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:#c7cad1;}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.linklike{background:none;border:none;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;padding:6px;}

/* ---------- forms ---------- */
label.field-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:block;}
.input{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);}
.input:focus{outline:none;border-color:var(--ink);}
.input-lg{font-size:22px;letter-spacing:2px;text-align:center;font-family:var(--font-mono);}

/* ---------- login screen ---------- */
.login-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;}
.login-logo-wrap img{width:96px;height:auto;}
.login-title{font-size:21px;font-weight:800;color:var(--ink);}
.login-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;}
.login-card{width:100%;max-width:360px;}
.tabswitch{display:flex;background:var(--line-soft);border-radius:10px;padding:3px;margin-bottom:16px;}
.tabswitch button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
.tabswitch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.errmsg{color:var(--danger);font-size:12.5px;font-weight:600;text-align:center;min-height:16px;}
.langpick{display:flex;gap:6px;margin-top:18px;}
.langpick button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;}
.langpick button.active{border-color:var(--ink);color:var(--ink);background:var(--line-soft);}

/* ---------- store list ---------- */
.searchbox{position:relative;}
.searchbox input{padding-inline-start:38px;}
.searchbox svg{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.storecard{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .12s, background .12s;}
.storecard:hover{border-color:#c7cad1;background:#fafafb;}
.storecard .num{width:44px;height:44px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;font-family:var(--font-mono);}
.storecard .info{flex:1;min-width:0;}
.storecard .name{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.storecard .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.storecard .chev{color:var(--muted);flex-shrink:0;}
.section-title{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 2px;}
html[data-lang="ar"] .section-title{text-transform:none;}

/* ---------- category chips ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 15px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.chip .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.active .sw{filter:brightness(1.6);}

/* ---------- item rows ---------- */
.itemcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;}
.itemcard.has-order{border-color:var(--red);box-shadow:0 0 0 1px var(--red);}
.itemcard .row1{display:flex;gap:10px;align-items:flex-start;}
.itemcard .thumb{width:8px;align-self:stretch;border-radius:4px;flex-shrink:0;}
.itemcard .titles{flex:1;min-width:0;}
.itemcard .name{font-weight:700;font-size:14px;color:var(--ink);line-height:1.35;}
.itemcard .brand{font-size:11.5px;color:var(--muted);margin-top:2px;}
.itemcard .code{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);margin-inline-start:6px;}
.itemcard .metrics{display:flex;gap:8px;flex-wrap:wrap;}
.metricbox{flex:1;min-width:90px;background:var(--bg);border-radius:8px;padding:7px 9px;}
.metricbox .lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;}
html[data-lang="ar"] .metricbox .lbl{text-transform:none;}
.metricbox .val{font-size:14px;font-weight:800;color:var(--ink);font-family:var(--font-mono);margin-top:1px;}
.metricbox.warn .val{color:var(--amber);}
.metricbox.low .val{color:var(--danger);}
.orderctrl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;background:var(--bg);border-radius:9px;padding:8px;}
.orderctrl .steplbl{font-size:11.5px;font-weight:700;color:var(--ink-soft);padding-inline-start:4px;flex:1;min-width:60px;}
.stepbtn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stepbtn:active{transform:scale(.94);}
.qtyinput{width:52px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 2px;font-weight:800;font-size:15px;font-family:var(--font-mono);background:#fff;flex-shrink:0;}
.orderval{font-size:11.5px;color:var(--muted);white-space:nowrap;flex-basis:100%;text-align:end;order:5;}
.orderval b{color:var(--red);font-family:var(--font-mono);}

.emptystate{text-align:center;padding:40px 20px;color:var(--muted);}
.emptystate svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}

/* ---------- floating cart bar ---------- */
.floatbar{position:sticky;bottom:0;background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.18);z-index:15;}
.floatbar .fcount{background:var(--red);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;font-family:var(--font-mono);}
.floatbar .fsum{flex:1;font-size:12.5px;color:#C7CBD4;}
.floatbar .fsum b{color:#fff;font-family:var(--font-mono);font-size:14px;}
.floatbar button{flex-shrink:0;}

/* ---------- cart / review screen ---------- */
.cartline{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px;}
.cartline .ci{flex:1;min-width:0;}
.cartline .cn{font-weight:700;font-size:13.5px;}
.cartline .cs{font-size:11.5px;color:var(--muted);margin-top:2px;}
.cartline .cv{text-align:end;flex-shrink:0;}
.cartline .cv b{font-family:var(--font-mono);font-size:14px;}
.cartline .cv .u{font-size:10.5px;color:var(--muted);display:block;}
.cartline .rm{width:28px;height:28px;border-radius:7px;border:none;background:var(--line-soft);color:var(--danger);font-size:16px;cursor:pointer;flex-shrink:0;}

.togglerow{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line-soft);}
.togglerow:last-child{border-bottom:none;}
.togglerow .tl{font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;margin:0;z-index:2;}
.switch .track{position:absolute;inset:0;background:#D6D9DF;border-radius:12px;transition:background .15s;}
.switch input:checked + .track{background:var(--green);}
.switch .thumb{position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked ~ .thumb{transform:translateX(18px);}
html[data-lang="ar"] .switch input:checked ~ .thumb{transform:translateX(-18px);}

.totalsbox{background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;}
.totalsbox .trow{display:flex;justify-content:space-between;font-size:13px;color:#C7CBD4;padding:4px 0;}
.totalsbox .trow b{color:#fff;font-family:var(--font-mono);}
.totalsbox .grand{font-size:22px;font-weight:800;font-family:var(--font-mono);border-top:1px solid rgba(255,255,255,.15);margin-top:8px;padding-top:10px;}

/* ---------- admin ---------- */
.adminstat{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.adminstat .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;}
.adminstat .box .lbl{font-size:11px;color:var(--muted);font-weight:700;}
.adminstat .box .when{font-size:13px;font-weight:800;margin-top:3px;}
.uploadzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;background:#fff;}
.uploadzone.drag{border-color:var(--red);background:#FFF3F2;}
.progresswrap{background:var(--line-soft);border-radius:8px;height:8px;overflow:hidden;}
.progressbar{height:100%;background:var(--green);width:0%;transition:width .2s;}
.pinrow{display:flex;gap:8px;}
.chkline{display:flex;align-items:center;gap:9px;padding:9px 4px;font-size:13.5px;font-weight:600;}
.chkline input{width:18px;height:18px;}
.orderlogitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
.orderlogitem .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
.orderlogitem .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ---------- toast ---------- */
#toastwrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:toastin .2s ease;}
.toast.success{background:var(--green);}
.toast.error{background:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- loading overlay ---------- */
#loadingOverlay{position:fixed;inset:0;background:rgba(21,24,29,.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.spinner{width:40px;height:40px;border-radius:50%;border:3.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- print sheet (off-screen render source for PDF) ---------- */
#printRoot{position:fixed;top:0;left:-99999px;width:0;height:0;overflow:visible;}
.pdfpage{width:794px;min-height:1123px;background:#fff;padding:40px 44px;font-family:'Cairo','Inter',sans-serif;color:#15181D;direction:rtl;position:relative;}
.pdfpage.ltr{direction:ltr;}
.pdf-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E2000A;padding-bottom:16px;margin-bottom:18px;}
.pdf-head .logo img{height:64px;}
.pdf-head .doctitle{text-align:end;}
.pdf-head .doctitle h1{margin:0;font-size:20px;color:#15181D;}
.pdf-head .doctitle .ordid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#767C88;margin-top:2px;}
.pdf-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#F4F5F7;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:11.5px;}
.pdf-meta .k{color:#767C88;font-weight:700;font-size:10px;text-transform:uppercase;}
.pdf-meta .v{font-weight:800;margin-top:2px;font-size:12.5px;}
.pdf-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.pdf-table th{background:#15181D;color:#fff;padding:8px 7px;font-size:10px;text-align:start;font-weight:700;}
.pdf-table td{padding:7px 7px;border-bottom:1px solid #E4E6EB;}
.pdf-table tr:nth-child(even) td{background:#FAFAFB;}
.pdf-table td.num,.pdf-table th.num{text-align:center;font-family:'IBM Plex Mono',monospace;}
.pdf-table .catrow td{background:#FFF3F2;font-weight:800;color:#B4000A;font-size:11px;padding:5px 7px;}
.pdf-table td.codecol{background:#EEF0F3;font-weight:800;letter-spacing:.4px;color:#15181D;border-inline-end:2px solid #15181D;}
.pdf-table th.codecol{border-inline-end:2px solid #fff;}
.pdf-table td.qtycol{background:rgba(6,127,62,.09);font-weight:800;color:#067F3E;}
.pdf-table th.qtycol{background:#067F3E;}
.pdf-table tr:nth-child(even) td.codecol{background:#E7E9EE;}
.pdf-table tr:nth-child(even) td.qtycol{background:rgba(6,127,62,.14);}
.pdf-foot{position:absolute;bottom:34px;left:44px;right:44px;font-size:9.5px;color:#767C88;display:flex;justify-content:space-between;border-top:1px solid #E4E6EB;padding-top:8px;}
.pdf-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px;}
.pdf-sign .box{border-top:1.5px solid #15181D;padding-top:6px;font-size:11px;color:#3A3F49;font-weight:700;}
.pdf-totals{margin-top:14px;margin-inline-start:auto;width:270px;background:#fff;color:#15181D;border:1.5px solid #15181D;border-radius:8px;padding:0;overflow:hidden;}
.pdf-totals .r{display:flex;justify-content:space-between;font-size:11.5px;padding:7px 14px;color:#3A3F49;border-bottom:1px solid #E4E6EB;}
.pdf-totals .r b{color:#15181D;font-family:'IBM Plex Mono',monospace;}
.pdf-totals .g{font-size:15px;font-weight:800;background:#15181D;color:#fff;border-bottom:none;padding:10px 14px;}
.pdf-totals .g b{color:#fff;font-family:'IBM Plex Mono',monospace;}
</style>
</head>

/* ---------------- EMBEDDED DATA ---------------- */
function readEmbeddedData(){
  const raw = document.getElementById("oo-data").textContent.trim();
  const bin = atob(raw);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const json = pako.inflate(bytes, {to:"string"});
  return JSON.parse(json);
}
function encodeEmbeddedData(obj){
  const json = JSON.stringify(obj);
  const compressed = pako.deflate(json, {gzip:true, level:9});
  let bin = "";
  const chunk = 8192;
  for(let i=0;i<compressed.length;i+=chunk){
    bin += String.fromCharCode.apply(null, compressed.subarray(i, i+chunk));
  }
  return btoa(bin);
}

/* ---------------- UTIL ---------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, children){
  const e = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v]) => {
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if(v !== null && v !== undefined) e.setAttribute(k, v);
  });
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function fmtMoney(n){ return (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return (Number(n)||0).toLocaleString("en-US"); }
function curr(){ return state.lang === "ar" ? "ر.س" : "SAR"; }
function cleanName(s){
  s = String(s||"").trim();
  // treat a bare leading-code (with or without a trailing dash, e.g. "011517 -") as "no real name"
  return /^0*\d+\s*-?\s*$/.test(s) ? "" : s;
}
function codeStr(sku){ return sku.artecalCode || String(sku.artecal).padStart(6,"0"); }
function nameOf(sku){
  const ar = cleanName(sku.nameAr), en = cleanName(sku.nameEn);
  const fallback = "#"+sku.artecal;
  return state.lang === "ar" ? (ar || en || fallback) : (en || ar || fallback);
}
function catLabel(key){ const m = catMeta(key); return state.lang === "ar" ? m.ar : m.en; }
function freshness(tsStr){
  if(!tsStr) return "stale";
  const t0 = new Date(tsStr.replace(" ","T")).getTime();
  if(isNaN(t0)) return "stale";
  const hrs = (Date.now() - t0) / 36e5;
  if(hrs <= 30) return "fresh";
  if(hrs <= 96) return "warn";
  return "stale";
}
function toast(msg, kind){

function renderLogin(){
  const s = el("div", {class:"screen center-content"});
  const card = el("div", {class:"card card-pad login-card"});

  card.appendChild(el("div", {class:"login-logo-wrap"}, [
    el("img", {src:"data:image/png;base64,"+window.OTHAIM_LOGO_B64, alt:"Othaim"}),
    el("div", {class:"login-title"}, [t("appName")]),
    el("div", {class:"login-sub"}, [t("tagline")])
  ]));

  const tabs = el("div", {class:"tabswitch"});
  const repBtn = el("button", {class: state.loginMode==="rep" ? "active":"", onclick:() => { state.loginMode="rep"; render(); }}, [t("loginAsRep")]);
  const mgrBtn = el("button", {class: state.loginMode==="manager" ? "active":"", onclick:() => { state.loginMode="manager"; render(); }}, [t("changePin")]);
  tabs.appendChild(repBtn); tabs.appendChild(mgrBtn);
  card.appendChild(tabs);

  const err = el("div", {class:"errmsg"});

    placeholder: state.loginMode==="rep" ? "•••••" : "••••"});

  const doLogin = () => {
    const val = input.value.trim();

/* ---------------- ITEMS SCREEN ---------------- */
function cartLineCount(){ return Object.keys(state.cart).length; }
function cartTotals(){
  let cartons=0, pieces=0, value=0;
  Object.entries(state.cart).forEach(([art, ctn]) => {
    const sku = state.skusByArt[art]; if(!sku) return;
    cartons += ctn; pieces += ctn*(Number(sku.pcPerCs)||0); value += ctn*(Number(sku.csPrice)||0);
  });
  return {cartons, pieces, value};
}

function renderItems(){
  const store = state.selectedStore;
  const s = el("div", {class:"screen"});
  s.appendChild(topbar({
    title: store.nameAr, subtitle: t("storeNo")+" "+store.storeNo,
    onBack: () => { state.screen="stores"; render(); },
    cartCount: cartLineCount(), onCart: () => { state.screen="cart"; render(); }
  }));
  const content = el("div", {class:"content", style:"gap:10px;"});

  const search = el("input", {class:"input", placeholder:t("searchItems"), value: state.query});
  content.appendChild(el("div", {class:"searchbox"}, [svgIcon("search"), search]));

  const chips = el("div", {class:"chiprow"});
  content.appendChild(chips);

  const list = el("div", {style:"display:flex;flex-direction:column;gap:10px;margin-top:2px;"});
  content.appendChild(list);

  const onHand = OO.onHand[String(store.storeNo)] || {};

  function categoriesPresent(){
    const set = {};
    OO.skus.forEach(sk => set[sk.category] = (set[sk.category]||0)+1);
    return set;
  }
  function drawChips(){
    chips.innerHTML = "";
    const cats = categoriesPresent();
    const allChip = el("div", {class:"chip"+(state.category==="all"?" active":""), onclick:() => {state.category="all"; drawChips(); drawList();}}, [t("all")]);
    chips.appendChild(allChip);
    Object.keys(cats).sort((a,b)=> cats[b]-cats[a]).forEach(cat => {
      const m = catMeta(cat);
      const chip = el("div", {class:"chip"+(state.category===cat?" active":""), onclick:() => {state.category=cat; drawChips(); drawList();}}, [
        el("span", {class:"sw", style:"background:"+m.color}), catLabel(cat)
      ]);
      chips.appendChild(chip);
    });
  }

  function matches(sku, q){
    if(!q) return true;
    q = q.toLowerCase();
    return String(sku.artecal).includes(q) || codeStr(sku).includes(q) || String(sku.zrep).includes(q) ||
      (sku.nameAr||"").toLowerCase().includes(q) || (sku.nameEn||"").toLowerCase().includes(q);
  }

  function drawList(){
    list.innerHTML = "";
    const q = search.value.trim();
    const filtered = OO.skus.filter(sk => (state.category==="all" || sk.category===state.category) && matches(sk, q));
    if(filtered.length === 0){ list.appendChild(el("div",{class:"emptystate"},[t("catNoLines")])); return; }
    filtered.sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
    filtered.forEach(sku => list.appendChild(renderItemCard(sku, onHand[sku.artecal])));
  }

  function renderItemCard(sku, oh){
    const m = catMeta(sku.category);
    const ctn = state.cart[sku.artecal] || 0;
    const ohQty = oh ? Number(oh.onHand)||0 : 0;
    const ohVal = ohQty * (Number(sku.pcPrice)||0);
    const marsQ = OO.marsStock[sku.artecal] ? Number(OO.marsStock[sku.artecal].qty)||0 : 0;

    const card = el("div", {class:"itemcard"+(ctn>0?" has-order":"")});
    const row1 = el("div", {class:"row1"});
    row1.appendChild(el("div", {class:"thumb", style:"background:"+m.color}));
    const titles = el("div", {class:"titles"});
    titles.appendChild(el("div", {class:"name"}, [nameOf(sku), el("span",{class:"code"},["#"+codeStr(sku)])]));
    titles.appendChild(el("div", {class:"brand"}, [ (sku.brand||"") + "  ·  " + catLabel(sku.category) ]));
    row1.appendChild(titles);
    card.appendChild(row1);

    const metrics = el("div", {class:"metrics"});
    const ohBox = el("div", {class:"metricbox"+(ohQty<=0?" low":"")});
    ohBox.appendChild(el("div", {class:"lbl"}, [t("onHand")]));
    ohBox.appendChild(el("div", {class:"val"}, [fmtInt(ohQty)+" pc"]));
    ohBox.appendChild(el("div", {class:"lbl", style:"margin-top:2px;"}, [fmtMoney(ohVal)+" "+curr()]));
    metrics.appendChild(ohBox);

    // On Hand converted to cartons, right next to On Hand — so the rep doesn't have to
    // divide by the pack size (PC/Carton) manually.
    const pcPerCs = Number(sku.pcPerCs)||0;
    const ctnBox = el("div", {class:"metricbox"});
    ctnBox.appendChild(el("div", {class:"lbl"}, [t("onHandCtnLbl")]));
    if(pcPerCs > 0){
      const ohCtn = Math.floor(ohQty / pcPerCs);
      const ohRem = ohQty - (ohCtn * pcPerCs);
      ctnBox.appendChild(el("div", {class:"val"}, [fmtInt(ohCtn)]));
      if(ohRem > 0) ctnBox.appendChild(el("div", {class:"lbl", style:"margin-top:2px;"}, ["+"+fmtInt(ohRem)+" "+t("pieces")]));
    } else {
      ctnBox.appendChild(el("div", {class:"val"}, ["—"]));
    }
    metrics.appendChild(ctnBox);

    const msBox = el("div", {class:"metricbox"});
    msBox.appendChild(el("div", {class:"lbl"}, [t("marsStock")]));
    msBox.appendChild(el("div", {class:"val"}, [fmtInt(marsQ)]));
    metrics.appendChild(msBox);

    const ratioBox = el("div", {class:"metricbox"});
    ratioBox.appendChild(el("div", {class:"lbl"}, [t("pcPerCsLbl")]));
    ratioBox.appendChild(el("div", {class:"val"}, [fmtInt(sku.pcPerCs)]));
    metrics.appendChild(ratioBox);
    card.appendChild(metrics);

    const ctrl = el("div", {class:"orderctrl"});
    ctrl.appendChild(el("div", {class:"steplbl"}, [t("order")]));
    const minus = el("button", {class:"stepbtn"}, ["–"]);
    const input = el("input", {class:"qtyinput", type:"tel", inputmode:"numeric", value: ctn || ""});
    const plus = el("button", {class:"stepbtn"}, ["+"]);
    const valSpan = el("span", {class:"orderval"});
    function refreshVal(){
      const c = Number(input.value)||0;
      const v = c*(Number(sku.csPrice)||0);
      valSpan.innerHTML = "";
      valSpan.appendChild(document.createTextNode(t("perCarton")+" "));
      const b = el("b",{},[fmtMoney(sku.csPrice)+" "+curr()]); valSpan.appendChild(b);
      if(c>0){ valSpan.appendChild(document.createTextNode("  =  ")); valSpan.appendChild(el("b",{},[fmtMoney(v)+" "+curr()])); }
    }
    function setQty(v){
      v = Math.max(0, Math.floor(Number(v)||0));
      input.value = v || "";
      if(v>0) state.cart[sku.artecal]=v; else delete state.cart[sku.artecal];
      card.classList.toggle("has-order", v>0);
      refreshVal();
      updateFloatbar();
    }
    minus.onclick = () => setQty((Number(input.value)||0)-1);
    plus.onclick = () => setQty((Number(input.value)||0)+1);
    input.addEventListener("input", () => setQty(input.value));
    refreshVal();
    ctrl.appendChild(minus); ctrl.appendChild(input); ctrl.appendChild(plus); ctrl.appendChild(valSpan);
    card.appendChild(ctrl);
    return card;
  }

  let floatbar;
  function updateFloatbar(){
    const totals = cartTotals();
    const count = cartLineCount();
    if(floatbar) floatbar.remove();
    if(count === 0) return;
    floatbar = el("div", {class:"floatbar"}, [
      el("div", {class:"fcount"}, [String(count)+" "+t("items")]),
      el("div", {class:"fsum"}, [ t("totalCartons")+": ", el("b",{},[fmtInt(totals.cartons)]), "   ", el("b",{},[fmtMoney(totals.value)+" "+curr()]) ]),
      el("button", {class:"btn btn-primary", onclick: () => { state.screen="cart"; render(); }}, [t("reviewOrder")])

    if(btn){ if(badge) badge.remove(); if(count>0) btn.appendChild(el("span",{class:"cartbadge"},[String(count)])); }
  }

  search.addEventListener("input", () => { state.query = search.value; drawList(); });
  drawChips(); drawList();
  s.appendChild(content);
  updateFloatbar();
  return s;
}

function saveOrderToHistory(store, orderId, totals, lines){
  try{
    const hist = JSON.parse(localStorage.getItem("oo_order_history") || "[]");
    hist.unshift({
      orderId, storeNo: store.storeNo, storeName: store.nameAr, date: new Date().toISOString(),
      cartons: totals.cartons, pieces: totals.pieces, value: totals.value,
      lineCount: lines.length
    });
    localStorage.setItem("oo_order_history", JSON.stringify(hist.slice(0, 200)));
  }catch(e){ /* storage full — non-fatal */ }

/* ---------------- PDF GENERATION ---------------- */
async function generateAndDownloadPdf(){
  const store = state.selectedStore;
  const lines = Object.entries(state.cart).map(([art, ctn]) => {
    const sku = state.skusByArt[art];
    return { sku, cartons: ctn, pieces: ctn*sku.pcPerCs, value: ctn*sku.csPrice };
  }).filter(l => l.sku);
  if(lines.length === 0) return;
  lines.sort((a,b) => (a.sku.category||"").localeCompare(b.sku.category||"") || nameOf(a.sku).localeCompare(nameOf(b.sku)));

  showLoading(true);
  try{
    const orderId = "OO-"+new Date().toISOString().replace(/[-:T.]/g,"").slice(0,14);
    const dateStr = new Date().toLocaleString("en-GB");
    const {blob, filename} = await buildPdf({ store, lines, orderId, dateStr,
      showValues: state.prefShowValues, showTotal: state.prefShowTotal });

    state.lastPdf = {blob, filename};
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

    const totals = cartTotals();
    saveOrderToHistory(store, orderId, totals, lines);

    const shareBtn = $("#shareBtn");
    if(shareBtn && navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:"application/pdf"})]})){
      shareBtn.classList.remove("hidden");
    }
    toast(t("orderId")+": "+orderId, "success");
  }catch(e){
    console.error(e);
    toast(t("genericErr"), "error");
  }finally{ showLoading(false); }

async function sharePdf(){
  if(!state.lastPdf) return;
  try{
    const file = new File([state.lastPdf.blob], state.lastPdf.filename, {type:"application/pdf"});
    await navigator.share({ files:[file], title: t("poTitle"), text: state.selectedStore.nameAr });
  }catch(e){ /* user cancelled share — ignore */ }
}

function groupByCategory(lines){
  const map = {};
  lines.forEach(l => { const c = l.sku.category||"Uncategorized"; (map[c] = map[c]||[]).push(l); });
  return map;
}

async function buildPdf({store, lines, orderId, dateStr, showValues, showTotal}){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:"mm", format:"a4" });
  const grouped = groupByCategory(lines);
  const catKeys = Object.keys(grouped);

  const flat = [];
  catKeys.forEach(cat => {
    flat.push({ type:"cat", cat });
    grouped[cat].forEach(l => flat.push({ type:"line", l }));
  });

  const ROWS_FIRST = 20, ROWS_NEXT = 26;
  const pages = [];
  let i = 0, first = true;
  while(i < flat.length){
    const cap = first ? ROWS_FIRST : ROWS_NEXT;
    pages.push(flat.slice(i, i+cap));
    i += cap; first = false;
  }
  if(pages.length === 0) pages.push([]);

  const totals = lines.reduce((a,l) => ({cartons:a.cartons+l.cartons, pieces:a.pieces+l.pieces, value:a.value+l.value}), {cartons:0,pieces:0,value:0});
  const isAr = state.lang === "ar";

  for(let p=0; p<pages.length; p++){
    const pageEl = buildPdfPageDom({
      store, orderId, dateStr, showValues, showTotal, isAr,
      rows: pages[p], pageNum: p+1, totalPages: pages.length, isFirst: p===0,
      isLast: p===pages.length-1, totals
    });
    document.getElementById("printRoot").appendChild(pageEl);
    const canvas = await html2canvas(pageEl, {scale:2, useCORS:true, backgroundColor:"#ffffff"});
    const img = canvas.toDataURL("image/jpeg", 0.95);
    if(p>0) pdf.addPage();
    pdf.addImage(img, "JPEG", 0, 0, 210, 297);
    pageEl.remove();
  }
  const filename = "Othaim-"+store.storeNo+"-"+orderId+".pdf";
  const blob = pdf.output("blob");
  return {blob, filename};
}

function buildPdfPageDom(o){

    const head = el("div", {class:"pdf-head"});
    head.appendChild(el("div", {class:"logo"}, [ el("img", {src:"data:image/png;base64,"+window.OTHAIM_LOGO_B64}) ]));
    const dt = el("div", {class:"doctitle"});
    dt.appendChild(el("h1",{},[ t("poTitle") ]));
    dt.appendChild(el("div", {class:"ordid"}, [ t("orderId")+": "+o.orderId ]));
    head.appendChild(dt);
    page.appendChild(head);

    const meta = el("div", {class:"pdf-meta"});
    const mk = (k,v) => { const c = el("div"); c.appendChild(el("div",{class:"k"},[t(k)])); c.appendChild(el("div",{class:"v"},[String(v)])); return c; };
    meta.appendChild(mk("storeNo", o.store.storeNo));
    meta.appendChild(mk("vendor", CONFIG.VENDOR_CODE));
    meta.appendChild(mk("salesman", state.salesman||""));
    meta.appendChild(mk("date", o.dateStr));
    page.appendChild(meta);
    page.appendChild(el("div", {style:"font-weight:800;font-size:13px;margin-bottom:8px;"}, [o.store.nameAr]));
  } else {
    const mini = el("div", {style:"display:flex;justify-content:space-between;font-size:11px;color:#767C88;border-bottom:1px solid #E4E6EB;padding-bottom:8px;margin-bottom:10px;"});
    mini.appendChild(el("div", {}, [ t("poTitle")+" — "+o.store.nameAr+" · #"+o.store.storeNo ]));
    mini.appendChild(el("div", {}, [ t("orderId")+": "+o.orderId ]));
    page.appendChild(mini);
  }

  const table = el("table", {class:"pdf-table"});
  const thead = el("thead");
  const trh = el("tr");
  const HEAD_CLASSES = ["", "", "num codecol", "num", "num qtycol", "num qtycol"];
  [ "#", o.isAr?"الصنف":"Item", o.isAr?"الكود (أرتيكل)":"Code (Artecal)", t("pcPerCsLbl"), t("cartons"), t("pieces") ]
    .concat(o.showValues ? [t("value")] : [])
    .forEach((h,idx) => trh.appendChild(el("th", {class: HEAD_CLASSES[idx]!==undefined?HEAD_CLASSES[idx]:"num"}, [h])));
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el("tbody");
  let n=0;
  o.rows.forEach(r => {
    if(r.type === "cat"){
      const tr = el("tr", {class:"catrow"});
      const td = el("td", {colspan: o.showValues ? "7":"6"}, [catLabel(r.cat)]);
      tr.appendChild(td); tbody.appendChild(tr);
    } else {
      n++;
      const l = r.l, sku = l.sku;
      const tr = el("tr");
      tr.appendChild(el("td", {}, [String(n)]));
      tr.appendChild(el("td", {}, [nameOf(sku)]));
      tr.appendChild(el("td", {class:"num codecol"}, [codeStr(sku)]));
      tr.appendChild(el("td", {class:"num"}, [fmtInt(sku.pcPerCs)]));
      tr.appendChild(el("td", {class:"num qtycol"}, [fmtInt(l.cartons)]));
      tr.appendChild(el("td", {class:"num qtycol"}, [fmtInt(l.pieces)]));
      if(o.showValues) tr.appendChild(el("td", {class:"num"}, [fmtMoney(l.value)]));
      tbody.appendChild(tr);
    }
  });
  table.appendChild(tbody);
  page.appendChild(table);

  if(o.isLast){
    if(o.showTotal){
      const tb = el("div", {class:"pdf-totals"});
      tb.appendChild(el("div", {class:"r"}, [t("totalCartons"), el("b",{},[fmtInt(o.totals.cartons)])]));
      tb.appendChild(el("div", {class:"r"}, [t("totalPieces"), el("b",{},[fmtInt(o.totals.pieces)])]));
      if(o.showValues) tb.appendChild(el("div", {class:"r g"}, [t("grandTotal"), el("b",{},[fmtMoney(o.totals.value)+" "+curr()])]));
      page.appendChild(tb);
    }
    const sign = el("div", {class:"pdf-sign"});
    sign.appendChild(el("div", {class:"box"}, [t("signRep")]));
    sign.appendChild(el("div", {class:"box"}, [t("signStore")]));
    page.appendChild(sign);
  }

  page.appendChild(el("div", {class:"pdf-foot"}, [
    el("span", {}, [t("generatedBy")]),
    el("span", {}, [t("page")+" "+o.pageNum+"/"+o.totalPages])
  ]));
  return page;
}

/* ---- parse an uploaded workbook, auto-detecting raw export vs clean template ---- */
function sheetRows(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {defval:""});
}
function leadCode(s){
  if(s === undefined || s === null || s === "") return null;
  const m = String(s).match(/^\s*0*(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function leadCodeStr(s, width){
  width = width || 6;
  if(s === undefined || s === null || s === "") return null;
  let m = String(s).match(/^\s*(\d+)\s*-/);
  if(m) return m[1];
  m = String(s).match(/^\s*0*(\d+)/);
  return m ? m[1].padStart(width, "0") : null;
}
// Some raw Mars/D365 exports have TWO similarly-named English-description columns:
// one genuinely bogus (just the leading item code, no real text) and one with the
// actual English product name. Scan every "Description English"-ish / blank-header
// column and use the first one that looks like a real name rather than a bare code.
function isBogusName(v){
  if(v === undefined || v === null) return true;
  const s = String(v).trim();
  return s === "" || /^0*\d+\s*-?\s*$/.test(s);
}
function bestEnName(r){
  const keys = Object.keys(r);
  for(const k of keys){
    if(/description\s*english/i.test(k) || /^__EMPTY/i.test(k) || /^unnamed/i.test(k)){
      const v = r[k];
      if(!isBogusName(v)) return String(v).trim();
    }
  }
  return "";
}
function parseWorkbook(wb){
  const out = {};

  // ---- Stores ----
  let storeRows = sheetRows(wb, "Stores");
  if(storeRows){
    out.stores = storeRows.filter(r => r.UserNumber !== undefined && r.UserNumber !== "").map(r => ({
      storeNo: Number(r.StoreNo), nameAr: r.StoreNameAR, region: r.Region, city: r.City,
      salesman: r.Salesman, userNumber: String(r.UserNumber)
    }));
  } else {
    const raw = sheetRows(wb, "Store");
    if(raw){
      out.stores = raw.filter(r => r["Salesman"] && r["User number"]).map(r => ({
        storeNo: Number(r["Store #"]),
        nameAr: String(r["Store Arabic Name With Number"]||"").replace(/^\s*0*\d+\s*-\s*/,""),
        region: r["Region"], city: r["City"], salesman: r["Salesman"], userNumber: String(r["User number"])
      }));
    }
  }

  // ---- SKUs ----
  let skuRows = sheetRows(wb, "SKUs");
  if(skuRows){
    out.skus = skuRows.map(r => ({
      artecal: Number(r.ArtecalNo), artecalCode: r.ArtecalCode ? String(r.ArtecalCode) : String(Number(r.ArtecalNo)).padStart(6,"0"),
      zrep: Number(r.ZrepCode)||0, nameAr: r.NameAR, nameEn: r.NameEN,
      category: r.Category || "Uncategorized", brand: r.Brand || "",
      pcPerCs: Number(r.PCperCS)||0, pcPrice: Number(r.PCPrice)||0, csPrice: Number(r.CSPrice)||0
    }));
  } else {
    const raw = sheetRows(wb, "SKU Data");
    if(raw){
      out.skus = raw.map(r => {
        const art = leadCode(r["Artecal#"]);
        const artCode = leadCodeStr(r["Item Arabic Description With Number"]) || (art!==null ? String(art).padStart(6,"0") : "");
        const nameAr = String(r["Item Arabic Description With Number"]||"").replace(/^\s*0*\d+\s*-\s*/,"");
        const cat = r["Category"] || inferCategory(nameAr) || "Uncategorized";
        return {
          artecal: art, artecalCode: artCode, zrep: Number(r["Zrep Cood"])||0, nameAr,
          nameEn: bestEnName(r),
          category: cat, brand: r["Brand"] || "",
          pcPerCs: Number(r["PC per CS"])||0, pcPrice: Number(r["PC Price"])||0, csPrice: Number(r["CS Price"])||0
        };
      }).filter(x => x.artecal);
    }
  }

  // ---- OnHand ----
  let onhandRows = sheetRows(wb, "OnHand");
  if(onhandRows){
    const map = {};
    onhandRows.forEach(r => {
      const s = String(r.StoreNo); const a = String(r.ArtecalNo);
      (map[s] = map[s]||{})[a] = { onHand:Number(r.OnHandPC)||0, min:Number(r.MinQty)||0, max:Number(r.MaxQty)||0, lastSold:String(r.LastSold||"") };
    });
    out.onHand = map;
  } else {
    const raw = sheetRows(wb, "On Hand Quantity");
    if(raw){
      const map = {};
      raw.forEach(r => {
        const s = leadCode(r["Store Arabic Name With Number"]);
        const a = leadCode(r["Item Arabic Description With Number"]);
        if(s === null || a === null) return;
        (map[s] = map[s]||{})[a] = {
          onHand:Number(r["On Hand Quantity"])||0, min:Number(r["Minimum Quantity"])||0,
          max:Number(r["Maximum Quantity"])||0, lastSold:String(r["Last Sold Date"]||"")
        };
      });
      out.onHand = map;
    }
  }

  // ---- Mars Stock ----
  let msRows = sheetRows(wb, "MarsStock");
  if(msRows){
    const map = {};
    msRows.forEach(r => { map[String(r.ArtecalNo)] = {qty:Number(r.MarsStockQty)||0, updated:String(r.DateCreated||"")}; });
    out.marsStock = map;
  } else {
    const raw = sheetRows(wb, "Mars Stock");
    if(raw){
      const map = {};
      raw.forEach(r => {
        const z = Number(r["ZREP"]);
        if(!z) return;
        map[String(z)] = {qty:Number(r["Mars Stock"])||0, updated:String(r["Date Created"]||""), _zrep:true};
      });
      out.marsStock = map;
      out._marsStockByZrep = true;
    }
  }

  return out;
}

async function doBuild(parsed, summaryEl){
  const checks = summaryEl.querySelectorAll("input[type=checkbox]");
  const selected = Array.from(checks).filter(c => c.checked).map(c => c.dataset.key);
  if(selected.length === 0) return;
  showLoading(true);
  try{
    const now = new Date().toISOString().slice(0,16).replace("T"," ");
    const merged = JSON.parse(JSON.stringify(OO)); // deep clone current data

    if(selected.includes("stores") && parsed.stores){ merged.stores = parsed.stores; merged.meta.lastUpdatedStores = now; }
    if(selected.includes("skus") && parsed.skus){ merged.skus = parsed.skus; merged.meta.lastUpdatedSKUs = now; }
    if(selected.includes("onHand") && parsed.onHand){ merged.onHand = parsed.onHand; merged.meta.lastUpdatedOnHand = now; }
    if(selected.includes("marsStock") && parsed.marsStock){
      // Mars Stock from the raw export is keyed by ZREP — remap to ArtecalNo via current SKUs
      let ms = parsed.marsStock;
      if(parsed._marsStockByZrep_unused){ /* no-op, placeholder */ }
      if(Object.values(ms)[0] && Object.values(ms)[0]._zrep){
        const zrepToArt = {};
        merged.skus.forEach(sk => { if(sk.zrep) zrepToArt[String(sk.zrep)] = sk.artecal; });
        const remapped = {};
        Object.entries(ms).forEach(([zrep, v]) => {
          const art = zrepToArt[zrep];
          if(art) remapped[String(art)] = {qty:v.qty, updated:v.updated};
        });
        ms = remapped;
      }
      merged.marsStock = ms;
      merged.meta.lastUpdatedMarsStock = now;
    }

    // filter OnHand/Stores consistency: keep only stores that still have a userNumber
    merged.stores = merged.stores.filter(st => st.userNumber);

    OO = merged; // reflect immediately in this session too, as visible confirmation
    reindexSkus();

    const newBlob64 = encodeEmbeddedData(OO);
    const newHtml = ORIGINAL_HTML.replace(
      /(<script id="oo-data"[^>]*>)[\s\S]*?(<\/script>)/,
      "$1" + newBlob64 + "$2"
    );
    const blob = new Blob([newHtml], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

    toast(t("buildDone"), "success");
    render();
  }catch(e){
    console.error(e);
    toast(t("genericErr"), "error");
  }finally{ showLoading(false); }
}
