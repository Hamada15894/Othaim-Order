<style>
:root{
  --red:#E2000A; --red-dark:#B4000A; --green:#067F3E; --green-light:#9DC418;
  --ink:#15181D; --ink-soft:#3A3F49; --muted:#767C88; --line:#E4E6EB; --line-soft:#EFF0F3;
  --bg:#F4F5F7; --paper:#FFFFFF; --amber:#B4740A; --danger:#C0281F;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 20px -8px rgba(20,22,28,.12);
  --font-ar:'Cairo',system-ui,sans-serif; --font-en:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--font-ar);-webkit-font-smoothing:antialiased;position:fixed;inset:0;width:100%;touch-action:pan-y;}
html[data-lang="en"] body{font-family:var(--font-en);}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:rgba(226,0,10,.18);}
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);letter-spacing:.2px;}

/* ---------- layout shell ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;}
:root[data-viewport="phone"] #app{max-width:460px;}
:root[data-viewport="wide"] #app{max-width:1040px;}
.storelist{display:flex;flex-direction:column;gap:8px;}
.histlist{display:flex;flex-direction:column;gap:8px;}
/* roomier layout on the computer view: stores + order history flow into two columns */
:root[data-viewport="wide"] .storelist{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
:root[data-viewport="wide"] .histlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
:root[data-viewport="wide"] .content{padding-left:22px;padding-right:22px;}
.screen{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;}

/* ---------- top bar ---------- */
.topbar{flex-shrink:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.topbar .brandmark{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.topbar .brandmark img{height:26px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px;}
.topbar .titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.topbar .t1{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .t2{font-size:11px;color:#B7BCC7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;}
.iconbtn:hover{background:rgba(255,255,255,.16);}
.iconbtn svg{width:18px;height:18px;}
.langpill{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px;flex-shrink:0;gap:2px;}
.langpill button{border:none;background:transparent;color:#B7BCC7;font-weight:800;font-size:11.5px;padding:6.5px 8px;border-radius:6px;cursor:pointer;line-height:1;min-width:26px;}
.langpill button.active{background:#fff;color:var(--ink);}
.cartbtn{position:relative;}
.cartbadge{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---------- status strip ---------- */
.statusstrip{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);direction:ltr;}
.statusstrip .cell{flex:1;padding:7px 12px;display:flex;flex-direction:column;gap:1px;border-inline-end:1px solid var(--line-soft);text-align:left;}
.statusstrip .ts{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
/* Reusable date/time pill (status strip + admin data-status cards): blue date · orange time. */
.stamp{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;
  border:1px solid #E3E7EE;border-radius:8px;padding:3px 8px;background:#fff;
  font-family:var(--font-mono);font-size:11px;font-weight:700;line-height:1.2;direction:ltr;
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.statusstrip .stamp{margin-top:4px;}
.stamp .sdate{color:#2563EB;}
.stamp .sdash{color:#9AA0AC;}
.stamp .stime{color:#F97316;}
.statusstrip .cell b{color:var(--ink-soft);font-size:11.5px;font-weight:700;}
.statusstrip .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-inline-end:5px;}
.dot-fresh{background:var(--green);} .dot-warn{background:var(--amber);} .dot-stale{background:var(--danger);}
.statusstrip .refresh{width:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;}
.statusstrip .refresh svg{width:15px;height:15px;}

/* ---------- generic content padding ---------- */
.content{flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
/* In the scrolling flex column, children keep their natural height (a child with its
   own overflow:hidden would otherwise be squeezed to 0 — that collapsed the stock hero). */
.content > *{flex-shrink:0;}
.center-content{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.center-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px;}

/* ---------- buttons ---------- */
.btn{appearance:none;border:none;border-radius:10px;padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, opacity .15s, background .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:#c7cad1;}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.linklike{background:none;border:none;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;padding:6px;}

/* ---------- forms ---------- */
label.field-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:block;}
.input{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);}
.input:focus{outline:none;border-color:var(--ink);}
.input-lg{font-size:22px;letter-spacing:2px;text-align:center;font-family:var(--font-mono);}

/* ---------- login screen ---------- */
/* Full-height branded layout: hero at top, form centred, language + freshness pinned at the bottom. */
.loginscreen{display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#E7F5EE 0%,#F3FAF6 24%,var(--bg) 58%);}
.login-hero{flex-shrink:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 42px) 24px 10px;}
.login-hero .login-logo{display:inline-block;background:#fff;border-radius:24px;padding:16px 20px;box-shadow:0 12px 30px rgba(6,127,62,.16);}
.login-hero .login-logo img{width:100px;height:auto;display:block;}
.login-hero .login-title{font-size:27px;font-weight:800;color:var(--ink);margin-top:16px;letter-spacing:-.3px;}
.login-hero .login-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;}
.login-body{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 20px;}
.login-foot{flex-shrink:0;padding:6px 20px calc(env(safe-area-inset-bottom,0px) + 22px);}
.login-title{font-size:21px;font-weight:800;color:var(--ink);}
.login-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;}
.login-card{width:100%;max-width:380px;box-shadow:0 12px 34px rgba(18,28,22,.10);border:1px solid var(--line);}
.login-foot .langpick{margin-top:0;}
.tabswitch{display:flex;background:var(--line-soft);border-radius:10px;padding:3px;margin-bottom:16px;}
.tabswitch button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
.tabswitch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.errmsg{color:var(--danger);font-size:12.5px;font-weight:600;text-align:center;min-height:16px;}
.langpick{display:flex;gap:6px;margin-top:18px;}
.langpick button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;}
.langpick button.active{border-color:var(--ink);color:var(--ink);background:var(--line-soft);}

/* ---------- store list ---------- */
.searchbox{position:relative;}
.searchbox input{padding-inline-start:38px;}
.searchbox svg{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.storecard{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .12s, background .12s;content-visibility:auto;contain-intrinsic-size:auto 78px;}
.storecard:hover{border-color:#c7cad1;background:#fafafb;}
.storecard .num{width:44px;height:44px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;font-family:var(--font-mono);}
.storecard .info{flex:1;min-width:0;}
.storecard .name{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.storecard .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.storecard .chev{color:var(--muted);flex-shrink:0;}
.section-title{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 2px;}
html[data-lang="ar"] .section-title{text-transform:none;}

/* ---------- category chips ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 15px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.chip .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.active .sw{filter:brightness(1.6);}

/* ---------- item rows ---------- */
/* compact item card — dense enough to scan hundreds of SKUs quickly */
.itemcard{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--cat,#C9CDD4);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:7px;content-visibility:auto;contain-intrinsic-size:auto 144px;}
.itemcard.has-order{border-color:var(--green);border-inline-start-color:var(--green);background:#F5FBF7;box-shadow:0 0 0 1px var(--green);}
.itemcard.oos{background:#FEF7F7;}
.itemcard .ic-head{display:flex;align-items:flex-start;gap:8px;}
.itemcard .titles{flex:1;min-width:0;}
.itemcard .name{font-weight:800;font-size:13px;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itemcard .nameAr{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itemcard .code{font-family:var(--font-mono);font-size:10px;font-weight:800;color:#4A5160;background:var(--bg);border-radius:5px;padding:3px 6px;flex-shrink:0;letter-spacing:.4px;}
.itemcard .seq{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;}
.itemcard.has-order .seq{background:var(--green);}
/* clear 4-cell metric grid — easy to read at a glance */
.itemcard .ic-grid{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;}
.itemcard .ic-grid .cell{padding:6px 3px;text-align:center;border-inline-start:1px solid var(--line);}
.itemcard .ic-grid .cell:first-child{border-inline-start:none;}
.itemcard .ic-grid .cell .k{font-size:9.5px;color:var(--muted);font-weight:700;line-height:1.1;}
.itemcard .ic-grid .cell .v{font-size:14px;font-weight:800;font-family:var(--font-mono);color:var(--ink);margin-top:3px;line-height:1;}
.itemcard .ic-grid .cell .v small{font-size:9px;color:var(--muted);font-weight:700;}
.itemcard .ic-grid .cell.oh{background:#EFF6FF;}
.itemcard .ic-grid .cell.oh .v{color:#0B5FA5;}
.itemcard .ic-grid .cell.oh.low{background:#FEF2F2;}
.itemcard .ic-grid .cell.oh.low .v{color:var(--danger);}
.itemcard .ic-grid .cell.mars{background:rgba(180,116,10,.08);}
.itemcard .ic-grid .cell.mars .v{color:#7A4E06;}
/* order row */
.itemcard .ic-order{display:flex;align-items:center;gap:8px;}
.itemcard .step{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.itemcard .step button{width:30px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.itemcard .step button:active{background:var(--line-soft);}
.itemcard .step input{width:46px;height:32px;border-radius:8px;border:1.5px solid var(--line);text-align:center;font-family:var(--font-mono);font-weight:800;font-size:14px;color:var(--ink);}
.itemcard.has-order .step input{border-color:var(--green);color:var(--green);}
.itemcard .step input:focus{outline:none;box-shadow:0 0 0 2px rgba(6,127,62,.2);border-color:var(--green);}
.itemcard .ov{flex:1;min-width:0;text-align:end;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600;}
.itemcard .ov b{font-family:var(--font-mono);color:var(--ink);font-size:13px;font-weight:800;}
.itemcard.has-order .ov b{color:var(--green);}
.itemcard .ic-warn{font-size:10.5px;color:var(--amber);font-weight:800;display:flex;align-items:center;gap:4px;}

/* ---- view switch (order view / grouped list) ---- */
.viewswitch{display:flex;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px;}
.viewswitch button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:8px;font-weight:800;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;}
.viewswitch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}

/* ---- store stock summary (hero) ---- */
.stocksum{background:linear-gradient(135deg,#15181D 0%,#242A33 100%);border-radius:var(--radius);overflow:hidden;color:#fff;box-shadow:var(--shadow);}
.stocksum .hero{padding:14px 15px 13px;position:relative;transition:background .2s;}
.stocksum .hero .lbl{font-size:11px;color:rgba(255,255,255,.72);font-weight:700;display:flex;align-items:center;gap:6px;}
.stocksum .hero .lbl .dotc{width:9px;height:9px;border-radius:3px;background:var(--green-light);}
.stocksum .hero .big{font-size:24px;font-weight:800;font-family:var(--font-mono);color:#fff;margin-top:3px;letter-spacing:-.5px;line-height:1.1;}
.stocksum .hero .big .u{font-size:14px;font-weight:700;color:rgba(255,255,255,.7);margin-inline-start:4px;}
.stocksum .hero .sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;font-weight:600;}
.stocksum .hero .expand{position:absolute;inset-inline-end:13px;top:14px;color:rgba(255,255,255,.8);font-size:11px;font-weight:800;background:rgba(255,255,255,.12);border:none;border-radius:7px;padding:6px 9px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
.stocksum .body{background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.1);padding:10px 15px 12px;display:none;}
.stocksum.open .body{display:block;}
.catbar{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;border-radius:6px;}
.catbar:hover{background:rgba(255,255,255,.05);}
.catbar.on{background:rgba(255,255,255,.1);padding-inline:6px;margin-inline:-6px;}
.catbar .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.catbar .nm{font-size:12.5px;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.catbar .vl{font-size:12px;font-family:var(--font-mono);font-weight:800;color:#fff;}
.catbar .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);width:70px;overflow:hidden;flex-shrink:0;}
.catbar .bar i{display:block;height:100%;border-radius:3px;}
.moneytoggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;padding-top:10px;font-size:12px;font-weight:700;color:rgba(255,255,255,.8);}

/* ---- suggested order chip + guard rail ---- */
.sugchip{display:inline-flex;align-items:center;gap:4px;background:rgba(6,127,62,.10);color:#067F3E;border:1px solid rgba(6,127,62,.28);border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.sugchip b{font-family:var(--font-mono);font-size:13px;}
.sugchip.none{background:var(--line-soft);color:var(--muted);border-color:var(--line);cursor:default;}
.sugchip.oos{background:rgba(226,0,10,.08);color:var(--red);border-color:rgba(226,0,10,.25);}
.bulkrow{display:flex;gap:8px;}
.bulkrow .btn{flex:1;padding:9px;font-size:12.5px;}

/* ---- grouped list view ---- */
.catgroup{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:8px;padding:8px 11px;margin-top:6px;}
.catgroup .sw{width:10px;height:10px;border-radius:3px;}
.catgroup .nm{font-weight:800;font-size:12.5px;flex:1;}
.catgroup .ct{font-size:11px;color:#B7BCC7;font-family:var(--font-mono);}
.brandsep{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 2px 3px;}
.listrow{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;content-visibility:auto;contain-intrinsic-size:auto 74px;}
.listrow .lseq{flex-shrink:0;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:var(--line-soft);color:var(--muted);font-size:10.5px;font-weight:800;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;}
.listrow.has-order .lseq{background:var(--green);color:#fff;}
.listrow.has-order{border-color:var(--green);box-shadow:0 0 0 1px var(--green);}
.listrow.oos{border-inline-start:3px solid var(--danger);}
.listrow .li{flex:1;min-width:0;}
.listrow .ln{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.listrow .lnAr{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;margin-top:1px;}
/* Keep the Arabic product name aligned directly UNDER the English one. The Arabic line
   carries dir=rtl (needed to shape "165ج" correctly), whose own start-edge is the right —
   so in English (LTR) mode we pin it left to match the English line instead of staggering. */
html[data-lang="en"] .listrow .lnAr,
html[data-lang="en"] .itemcard .nameAr,
html[data-lang="en"] .cartline .cnAr{text-align:left;}
html[data-lang="ar"] .listrow .ln,
html[data-lang="ar"] .itemcard .name{text-align:right;}
.listrow .lc{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-weight:700;}
.rowmeta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:4px;font-size:10.5px;color:var(--muted);font-weight:700;}
.rowmeta b{font-family:var(--font-mono);color:var(--ink);font-size:11px;}
.rowmeta b.code{background:var(--bg);border-radius:5px;padding:2px 5px;letter-spacing:.3px;}
.rowmeta .sep{color:var(--line);}
.rowmeta.oos b{color:var(--danger);}
.rowmeta.oos b.code{color:var(--ink);}
.ministep{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.ministep button{width:28px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1;}
.ministep input{width:40px;height:30px;border-radius:7px;border:1.5px solid var(--line);text-align:center;font-family:var(--font-mono);font-weight:800;font-size:13px;color:var(--ink);}
.ministep input:focus{outline:none;border-color:var(--green);}
.ministep .sug{font-size:10px;color:#067F3E;font-weight:800;text-align:center;cursor:pointer;background:none;border:none;padding:2px 0 0;font-family:inherit;}

.emptystate{text-align:center;padding:40px 20px;color:var(--muted);}
.emptystate svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}

/* ---------- floating cart bar ---------- */
.floatbar{flex-shrink:0;background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.18);z-index:15;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.floatbar .fcount{background:var(--red);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;font-family:var(--font-mono);}
.floatbar .fsum{flex:1;font-size:12.5px;color:#C7CBD4;}
.floatbar .fsum b{color:#fff;font-family:var(--font-mono);font-size:14px;}
.floatbar button{flex-shrink:0;}

/* ---------- cart / review screen ---------- */
.cartline{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--green);border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;gap:7px;}
.cartline .top{display:flex;align-items:flex-start;gap:10px;}
.cartline .ci{flex:1;min-width:0;}
.cartline .cn{font-weight:800;font-size:13px;line-height:1.25;display:flex;align-items:baseline;gap:6px;}
.cartline .cseq{flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:800;color:#fff;background:var(--green);border-radius:5px;padding:1px 6px;}
.cartline .cnAr{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.25;}
.cartline .rm{width:26px;height:26px;border-radius:7px;border:none;background:var(--line-soft);color:var(--danger);font-size:15px;cursor:pointer;flex-shrink:0;}
.cartline .bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cartstep{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.cartstep button{width:32px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.cartstep button:active{background:var(--line-soft);}
.cartstep input{width:46px;height:34px;border-radius:8px;border:1.5px solid var(--green);text-align:center;font-family:var(--font-mono);font-weight:800;font-size:15px;color:var(--ink);}
.cartstep input:focus{outline:none;box-shadow:0 0 0 2px rgba(6,127,62,.2);}
.cartstep .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-inline-end:2px;}
.cartline .cv{text-align:end;flex-shrink:0;}
.cartline .cv b{font-family:var(--font-mono);font-size:16px;color:var(--ink);}
.cartline .cv .u{font-size:10.5px;color:var(--muted);display:block;margin-top:1px;}
.cartline .rm{width:28px;height:28px;border-radius:7px;border:none;background:var(--line-soft);color:var(--danger);font-size:16px;cursor:pointer;flex-shrink:0;}

.togglerow{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line-soft);}
.togglerow:last-child{border-bottom:none;}
.togglerow .tl{font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;margin:0;z-index:2;}
.switch .track{position:absolute;inset:0;background:#D6D9DF;border-radius:12px;transition:background .15s;}
.switch input:checked + .track{background:var(--green);}
.switch .thumb{position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked ~ .thumb{transform:translateX(18px);}
html[data-lang="ar"] .switch input:checked ~ .thumb{transform:translateX(-18px);}

.totalsbox{background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;}
.totalsbox .trow{display:flex;justify-content:space-between;font-size:13px;color:#C7CBD4;padding:4px 0;}
.totalsbox .trow b{color:#fff;font-family:var(--font-mono);}
.totalsbox .grand{font-size:22px;font-weight:800;font-family:var(--font-mono);border-top:1px solid rgba(255,255,255,.15);margin-top:8px;padding-top:10px;}

/* ---------- admin ---------- */
.adminstat{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.adminstat .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;}
.adminstat .box .lbl{font-size:11px;color:var(--muted);font-weight:700;}
.adminstat .box .when{margin-top:8px;display:flex;align-items:center;gap:6px;}
.uploadzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;background:#fff;}
.uploadzone.drag{border-color:var(--red);background:#FFF3F2;}
.progresswrap{background:var(--line-soft);border-radius:8px;height:8px;overflow:hidden;}
.progressbar{height:100%;background:var(--green);width:0%;transition:width .2s;}
.pinrow{display:flex;gap:8px;}
.chkrow{border-bottom:1px solid var(--line-soft);padding:4px 0;}
.chkline{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:13.5px;font-weight:700;cursor:pointer;}
.chkline input{width:18px;height:18px;flex-shrink:0;}
.chkdiag{margin:2px 0 6px 30px;margin-inline-start:30px;font-size:12px;color:var(--green);font-weight:700;line-height:1.5;background:rgba(6,127,62,.07);border-radius:8px;padding:7px 10px;}
.chkdiag.bad{color:var(--danger);background:rgba(226,0,10,.06);}
.chkdiag .warn{color:var(--danger);font-weight:800;margin-top:4px;}
.chkdiag .cols{color:var(--muted);font-weight:600;font-size:10.5px;margin-top:3px;font-family:var(--font-mono);}
.chkdiag .diffline{margin-top:5px;color:var(--ink-soft);}
.chkdiag .diffline b{font-family:var(--font-mono);color:var(--ink);}

.buildok .okchanges .okchname{color:var(--ink-soft);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.buildok .okchanges .okchval{font-family:var(--font-mono);color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.buildok .okchanges .okchval b{color:var(--green);font-size:13px;}
/* Manager success card: brand-new items Othaim added */
.buildok .newitems{margin-top:12px;background:#F5F8FF;border:1px solid #CADBFF;border-radius:10px;padding:12px 13px;}
.buildok .newitems .ni-head{display:flex;align-items:center;gap:8px;}
.buildok .newitems .ni-title{font-size:13px;font-weight:800;color:#2563EB;}
.buildok .newitems .ni-count{font-size:11.5px;font-weight:800;color:#fff;background:#2563EB;border-radius:999px;padding:1px 9px;min-width:22px;text-align:center;}

.buildok .newitems .ni-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;}

.buildok .newitems .ni-name{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Store page: what's new / changed for THIS store (rep & manager preview) */
.whatsnew{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;border-inline-start:3px solid #2563EB;}
.whatsnew .wn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;}
.whatsnew .wn-head-l{display:flex;flex-direction:column;gap:6px;min-width:0;}
.whatsnew .wn-title{font-size:13.5px;font-weight:800;color:var(--ink);}
.whatsnew .wn-badges{display:flex;flex-wrap:wrap;gap:6px;}

.whatsnew .wn-b.added{background:rgba(6,127,62,.1);color:var(--green);}
.whatsnew .wn-b.missing{background:rgba(180,116,10,.12);color:var(--amber);}
.whatsnew .wn-b.removed{background:rgba(192,40,31,.1);color:var(--danger);}

.whatsnew .wn-code{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--line-soft);border-radius:5px;padding:1px 6px;flex-shrink:0;min-width:54px;text-align:center;}
.whatsnew .wn-name{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Opportunity / gap filter (item screen) */
.gapbar{display:flex;flex-direction:column;gap:8px;}

.gapthresh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.gapthresh .gt-opt.on{border-color:#2563EB;background:#2563EB;color:#fff;}
.gap-hint{font-size:11.5px;color:var(--muted);line-height:1.5;}
/* Manager region search */
.regionsearch{display:flex;flex-direction:column;gap:10px;}
.rs-thr{margin-top:-2px;}
.rs-results{display:flex;flex-direction:column;gap:4px;}
.rs-hit{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;}
.rs-hit:active{background:var(--line-soft);}
.rs-hit-code{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--line-soft);border-radius:5px;padding:1px 6px;flex-shrink:0;min-width:54px;text-align:center;}
.rs-hit-name{flex:1;font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs-hit-add{font-size:16px;font-weight:800;color:#2563EB;flex-shrink:0;}
.rs-none{font-size:12px;color:var(--muted);padding:6px 2px;}

.rs-chip{display:inline-flex;align-items:center;gap:6px;background:#2563EB;color:#fff;border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:700;max-width:100%;}
.rs-chip-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.rs-x{width:18px;height:18px;border:none;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;flex-shrink:0;}
.rs-out{display:flex;flex-direction:column;gap:12px;}
.rs-empty{font-size:12.5px;color:var(--muted);line-height:1.6;padding:6px 2px;}
.rs-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.rs-h{display:flex;align-items:center;gap:10px;padding:12px 13px 0;}
.rs-h-name{flex:1;font-size:14px;font-weight:800;color:var(--ink);}
.rs-h-code{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--line-soft);border-radius:5px;padding:1px 7px;flex-shrink:0;}
.rs-sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:11px 13px;}
.rs-pill{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;}
.rs-pl{font-size:10.5px;color:var(--muted);font-weight:700;}
.rs-pv{font-size:16px;font-weight:800;font-family:var(--font-mono);}
.rs-pill.blue .rs-pv{color:#2563EB;} .rs-pill.green .rs-pv{color:var(--green);} .rs-pill.amber .rs-pv{color:var(--amber);} .rs-pill.ink .rs-pv{color:var(--ink);}
.rs-reps{display:flex;flex-direction:column;border-top:1px solid var(--line-soft);}
.rs-rep{border-bottom:1px solid var(--line-soft);}
.rs-rep:last-child{border-bottom:none;}
.rs-rep-h{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;}
.rs-rep-l{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
.rs-rep-name{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs-rep-b{display:flex;flex-wrap:wrap;gap:5px;}
.rs-b{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;font-family:var(--font-mono);}
.rs-b.total{background:var(--line-soft);color:var(--ink-soft);}
.rs-b.carry{background:rgba(6,127,62,.1);color:var(--green);}
.rs-b.gap{background:rgba(180,116,10,.12);color:var(--amber);}
.rs-chev{color:var(--muted);font-size:12px;flex-shrink:0;}
.rs-rep-body{display:none;flex-direction:column;padding:0 13px 8px;}
.rs-rep.open .rs-rep-body{display:flex;}
.rs-store{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-top:1px dashed rgba(0,0,0,.05);}
.rs-store-name{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs-store-oh{font-family:var(--font-mono);font-weight:700;color:var(--ink);flex-shrink:0;}
.rs-store.gap .rs-store-name{color:var(--amber);font-weight:600;}
.rs-store.gap .rs-store-oh{color:var(--amber);}
.orderlogitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
.orderlogitem .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:10px;}
.orderlogitem .subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px;}
.orderlogitem .sub{font-size:11.5px;color:var(--muted);}
.orderlogitem .delx{flex-shrink:0;width:26px;height:26px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;font-size:17px;line-height:1;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.orderlogitem .delx:active{background:rgba(226,0,10,.08);color:var(--danger);border-color:var(--danger);}
.histhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;grid-column:1/-1;}
.histhdr .histcount{font-size:12px;font-weight:700;color:var(--muted);}
.histhdr .histclear{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--danger);background:rgba(226,0,10,.06);border:1px solid rgba(226,0,10,.25);border-radius:8px;padding:6px 11px;cursor:pointer;}
.histhdr .histclear svg{width:15px;height:15px;}
.histhdr .histclear:active{background:rgba(226,0,10,.13);}

/* ---------- toast ---------- */
#toastwrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:toastin .2s ease;}
.toast.success{background:var(--green);}
.toast.error{background:var(--danger);}
.toast.warn{background:#a86a00;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- loading overlay ---------- */
#loadingOverlay{position:fixed;inset:0;background:rgba(21,24,29,.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.spinner{width:40px;height:40px;border-radius:50%;border:3.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- print sheet (off-screen render source for PDF) ---------- */
#printRoot{position:fixed;top:0;left:-99999px;width:0;height:0;overflow:visible;}
.pdfpage{width:794px;min-height:1123px;background:#fff;padding:46px 48px 78px;font-family:'Cairo','Inter',sans-serif;color:#20242C;direction:rtl;position:relative;box-sizing:border-box;}
.pdfpage.ltr{direction:ltr;}
/* header */
.pdf-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.pdf-head .logo img{height:50px;display:block;}
.pdf-head .doctitle{text-align:end;}
.pdf-head .doctitle .kicker{display:inline-block;border:1px solid #D7DBE2;color:#68707C;background:#F7F8FA;font-size:8.5px;font-weight:700;letter-spacing:1.2px;padding:4px 11px;border-radius:5px;text-transform:uppercase;}
.pdf-head .doctitle h1{margin:11px 0 0;font-size:30px;font-weight:800;color:#13161B;line-height:.98;letter-spacing:-.4px;}
.pdf-head .doctitle .h1ar{font-size:12.5px;font-weight:700;color:#9198A4;margin-top:5px;letter-spacing:.2px;}
.pdf-head .doctitle .docsub{font-size:8.5px;color:#A6ACB8;margin-top:7px;max-width:290px;margin-inline-start:auto;line-height:1.55;}
.pdf-rule{height:2.5px;background:#067F3E;border-radius:2px;margin-bottom:20px;}
/* meta */
.pdf-meta{display:flex;background:#fff;border:1px solid #E4E7ED;border-radius:9px;padding:0;margin-bottom:22px;overflow:hidden;}
.pdf-meta .cell{flex:1;padding:12px 16px;border-inline-start:1px solid #EDEFF3;}
.pdf-meta .cell:first-child{border-inline-start:none;}
.pdf-meta .k{color:#9AA0AC;font-weight:700;font-size:8px;letter-spacing:.7px;}
.pdfpage:not(.arlang) .pdf-meta .k{text-transform:uppercase;}
.pdf-meta .v{font-weight:800;margin-top:6px;font-size:13px;color:#13161B;line-height:1.2;}
.pdf-meta .cell.store .v{color:#067F3E;}
.pdf-meta .cell.idcell .v{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:-.2px;word-break:break-all;}
/* table */
.pdf-table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:auto;}
.pdf-table thead th{background:#13161B;color:#fff;padding:11px 9px;font-size:9px;text-align:end;font-weight:600;white-space:nowrap;letter-spacing:.4px;text-transform:uppercase;}
.pdf-table thead th.name,.pdf-table thead th.idx{text-align:start;}
.pdf-table thead th.codecol,.pdf-table thead th.packcol,.pdf-table thead th.ohcol,.pdf-table thead th.qtycol{text-align:center;}
.pdf-table thead th.qtycol{background:#067F3E;color:#fff;}
.pdf-table tbody td{padding:8px 9px;border-bottom:1px solid #EDEFF2;text-align:end;vertical-align:middle;color:#2C313A;}
.pdf-table tbody tr:nth-child(even) td{background:#FAFBFC;}
.pdf-table tbody tr:last-child td{border-bottom:1.5px solid #D6DAE1;}
.pdf-table td.name{text-align:start;font-weight:700;color:#171A20;line-height:1.3;font-size:11px;padding-inline-end:14px;}
.pdf-table td.name .ar{font-size:9.5px;color:#7C828E;font-weight:600;margin-top:2px;direction:rtl;}
.pdf-table td.num{font-family:'IBM Plex Mono',monospace;white-space:nowrap;font-weight:600;color:#20242C;}
.pdf-table td.idx{color:#B2B7C1;font-family:'IBM Plex Mono',monospace;width:24px;text-align:center;font-size:10px;font-weight:600;}
.pdf-table td.packcol{font-family:'IBM Plex Mono',monospace;text-align:center;color:#5A616D;font-weight:600;}
/* code column: Othaim code prominent, Zrep small underneath */
.pdf-table td.codecol{background:#F4F6F8;border-inline:1px solid #E6E9EF;padding:6px 10px;text-align:center;}
.pdf-table tr:nth-child(even) td.codecol{background:#EFF2F5;}
.pdf-table .oth{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11.5px;letter-spacing:.4px;color:#13161B;}
.pdf-table .zr{font-family:'IBM Plex Mono',monospace;font-size:8px;color:#9098A4;margin-top:2px;font-weight:600;letter-spacing:.2px;}
.pdf-table .zr b{color:#8A909C;font-weight:700;}
/* on-hand columns — calm cool neutral (replaces the muddy tan) */
.pdf-table td.ohcol{background:#F1F4F8;color:#3D434E;font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:center;}
.pdf-table tr:nth-child(even) td.ohcol{background:#EBEFF4;}
.pdf-table td.ohcol .cs{font-size:8.5px;color:#94A0B0;}
/* order column — the single emphasised column (what the sheet is for) */
.pdf-table td.qtycol{background:#EAF4EE;color:#056331;font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:13px;text-align:center;border-inline:1px solid #D6E8DE;}
.pdf-table tr:nth-child(even) td.qtycol{background:#E1F0E8;}
/* category band — one consistent style, quiet neutral with a green edge + small colour chip */
.pdf-table .catrow td{padding:0;border-bottom:none;}
.pdf-table .catband{display:flex;align-items:center;gap:9px;padding:9px 12px;font-weight:800;font-size:11px;color:#13161B;background:#F3F5F8;border-inline-start:3px solid #067F3E;margin-top:7px;letter-spacing:.2px;}
.pdf-table .catband .dot{width:9px;height:9px;border-radius:2.5px;flex-shrink:0;}
.pdf-table .catband .ct{margin-inline-start:auto;font-size:8.5px;color:#8A909C;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:.4px;text-transform:uppercase;}
.pdf-table.tight{font-size:10.5px;}
.pdf-table.tight thead th{padding:9px 5px;font-size:8.5px;}
.pdf-table.tight tbody td{padding:6px 5px;}
.pdf-table.tight .oth{font-size:10.5px;}
/* totals + signatures */
.pdf-after{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-top:26px;}
.pdf-sign{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-bottom:6px;}
.pdf-sign .box{border-top:1.5px solid #C9CED6;padding-top:8px;font-size:10.5px;color:#6C7480;font-weight:700;}
.pdf-totals{width:300px;flex-shrink:0;border:1px solid #E0E4EA;border-radius:10px;overflow:hidden;}
.pdf-totals .r{display:flex;justify-content:space-between;font-size:11.5px;padding:10px 16px;color:#4A5058;border-bottom:1px solid #EDEFF2;font-weight:600;}
.pdf-totals .r b{color:#13161B;font-family:'IBM Plex Mono',monospace;font-weight:700;}
.pdf-totals .g{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;background:#13161B;color:#fff;border-bottom:none;padding:13px 16px;letter-spacing:.2px;}
.pdf-totals .g b{color:#fff;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:800;}
.pdf-totals .g .cur{font-size:10px;color:#7FD69F;margin-inline-start:4px;font-weight:700;}
.pdf-foot{position:absolute;bottom:34px;left:48px;right:48px;font-size:8.5px;color:#A6ACB8;display:flex;justify-content:space-between;border-top:1px solid #EDEFF2;padding-top:9px;font-weight:600;}
</style>

/* ---------------- EMBEDDED DATA ---------------- */
// Decode a base64(gzip(JSON)) blob back to the data object.
function decodeBlob(b64){
  const bin = atob(String(b64).trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const json = pako.inflate(bytes, {to:"string"});
  return JSON.parse(json);
}
const LS_DATA_KEY = "oo_data_blob", LS_DATA_BUILT = "oo_data_builtAt";
// The dataset baked into this file at deploy time.
function readEmbeddedData(){
  return decodeBlob(document.getElementById("oo-data").textContent);
}
// The live dataset = the NEWEST of (baked-in data, last update built on THIS device).
// Persisting the manager's last build on his device means a reload/reopen never silently
// reverts to yesterday's baked data — the #1 reason an update "didn't show". Newest wins by
// build time, so a freshly-deployed file (newer baked time) always overrides an older local copy.
function loadLiveData(){
  const baked = readEmbeddedData();
  try{
    const b64 = localStorage.getItem(LS_DATA_KEY);
    const built = localStorage.getItem(LS_DATA_BUILT);
    if(b64 && built && String(built) > String(baked.meta && baked.meta.builtAt || "")){
      const local = decodeBlob(b64);
      if(local && Array.isArray(local.skus) && local.skus.length && local.stores && local.stores.length){
        local.meta = local.meta || {}; local._fromLocal = true;
        return local;
      }
    }
  }catch(e){ /* localStorage blocked / corrupt → fall back to baked */ }
  return baked;
}
function encodeEmbeddedData(obj){
  const json = JSON.stringify(obj);
  const compressed = pako.deflate(json, {gzip:true, level:9});
  let bin = "";
  const chunk = 8192;
  for(let i=0;i<compressed.length;i+=chunk){
    bin += String.fromCharCode.apply(null, compressed.subarray(i, i+chunk));
  }
  return btoa(bin);
}

let OO = null; // the live embedded dataset for this session

/* ================= FIREBASE (LIVE DATA SYNC) =================
   The manager publishes the day's data to Firebase once; every rep's app reads it live —
   no GitHub re-deploy for daily updates. Everything here is defensive: if Firebase fails to
   load (offline / blocked) the app simply keeps using the baked + on-device data, so it never
   breaks. Reps only READ (public); only the signed-in manager can WRITE (see security rules
   in the README). VERIFY this config matches your Firebase console exactly (Project settings →
   your web app → SDK setup) — if live sync doesn't connect, re-paste your exact config here. */

  apiKey: "AIzaSyDEv5NSdNwZApLpKNdVWEtQGS9tILgW84I",
  authDomain: "othaim-order.firebaseapp.com",
  databaseURL: "https://othaim-order-default-rtdb.firebaseio.com",
  projectId: "othaim-order",

  messagingSenderId: "695853036509",
  appId: "1:695853036509:web:347d198aac9831be5d7c34"
};
const FB_DATA_PATH = "oo_data";
let fbDb = null, fbReady = false;
function initFirebase(){
  if(typeof firebase === "undefined") return false;   // SDK didn't load (offline/blocked) → skip
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    fbReady = true;
    return true;
  }catch(e){ console.warn("Firebase init skipped:", e && e.message); return false; }
}
// Subscribe to the shared dataset. Fires immediately with the current value and again on every
// change — so a rep with the app open sees a manager's publish within seconds. Only applies data
// that is NEWER (by build time) than what the device already has, and never downgrades.
function syncFromFirebase(){
  if(!fbReady || !fbDb) return;
  try{
    fbDb.ref(FB_DATA_PATH).on("value", (snap) => {
      const val = snap.val();
      if(!val || !val.blob || !val.builtAt) return;
      const localBuilt = (OO && OO.meta && OO.meta.builtAt) || "";
      if(String(val.builtAt) <= String(localBuilt)) return;   // not newer → ignore
      try{
        const data = decodeBlob(val.blob);
        if(!(data && Array.isArray(data.skus) && data.skus.length && data.stores && data.stores.length)) return;
        OO = data; reindexSkus();
        try{ localStorage.setItem(LS_DATA_KEY, val.blob); localStorage.setItem(LS_DATA_BUILT, val.builtAt); }catch(e){}
        // Don't yank the screen out from under a rep who is mid-order; refresh other screens live.
        if(state.screen !== "items" && state.screen !== "cart") render();
        toast(t("liveUpdated"), "success");
      }catch(e){ console.warn("live data apply failed:", e && e.message); }
    }, (err) => { console.warn("Firebase read error:", err && err.message); });
  }catch(e){ console.warn(e); }
}
// Publish the current dataset so every rep gets it live. No password, no sign-in — the Realtime
// Database rules are open, so the manager just uploads the file and it writes straight through.
async function publishToFirebase(){
  if(!fbReady || !fbDb){ toast(t("fbUnavailable"), "error"); return false; }
  try{
    const blob64 = encodeEmbeddedData(OO);
    await fbDb.ref(FB_DATA_PATH).set({ blob: blob64, builtAt: OO.meta.builtAt || new Date().toISOString(), by: "manager" });
    toast(t("fbPublished"), "success");
    return true;
  }catch(e){ console.warn("Firebase publish failed:", e && e.message); toast(t("fbPublishErr"), "error"); return false; }
}

// Keep the logged-in session on THIS device so a reload (the Refresh button, or just reopening the
// app) lands the user back where they were instead of on the login screen. Cleared on logout.
function saveSession(){
  try{
    if(state.user || state.adminPin){
      localStorage.setItem("oo_session", JSON.stringify({
        loginMode: state.loginMode, user: state.user, salesman: state.salesman,
        adminPin: state.adminPin, screen: state.screen,
        storeNo: state.selectedStore ? state.selectedStore.storeNo : null,
        cart: state.cart || {}
      }));
    } else { localStorage.removeItem("oo_session"); }
  }catch(e){}
}
function restoreSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem("oo_session")||"null"); }catch(e){}
  if(!s) return false;
  try{
    if(s.user === "__preview__"){
      state.user = "__preview__"; state.salesman = s.salesman || t("previewLabel");
      state.stores = (OO.stores||[]).slice(); state.loginMode = "manager";
      state.screen = ["stores","items","cart"].includes(s.screen) ? s.screen : "stores";
    } else if(s.loginMode === "rep" && s.user){
      const mine = (OO.stores||[]).filter(st => String(st.userNumber) === String(s.user));
      if(mine.length === 0) return false;   // reassigned / removed → fall back to login
      state.user = s.user; state.salesman = mine[0].salesman; state.stores = mine; state.loginMode = "rep";
      state.screen = ["stores","items","cart"].includes(s.screen) ? s.screen : "stores";
    } else if(s.loginMode === "manager" && s.adminPin && String(s.adminPin) === String(OO.meta.adminPin)){
      state.adminPin = s.adminPin; state.loginMode = "manager"; state.screen = "admin";
    } else { return false; }
    if(state.screen === "items" || state.screen === "cart"){
      const st = (state.stores||[]).find(x => String(x.storeNo) === String(s.storeNo));
      if(st) state.selectedStore = st; else state.screen = "stores";
    }

// NFKC folds broken Arabic "presentation form" glyphs (e.g. the ﻼ lam-alef ligature that
// leaked in from the source file) back to normal letters, so names never render garbled.
function normText(s){ s = String(s||""); try { return s.normalize("NFKC"); } catch(e){ return s; } }

// space before the number so it becomes كريسبي 30ج while keeping the unit (30ج) together.
function spaceArDigits(s){ return String(s).replace(/([؀-ۿ])(\d)/g, "$1 $2"); }
function cleanName(s){

}

function freshness(tsStr){
  if(!tsStr) return "stale";

  const hrs = (Date.now() - t0) / 36e5;

  if(hrs <= 96) return "warn";
  return "stale";
}

/* ---------------- STOCK / SUGGESTION HELPERS ---------------- */
// On-hand expressed in cartons: the decimal figure the rep is used to seeing
// ("603 pieces = 4.2 cartons") plus the exact full-cartons + loose-pieces split.
function ohCartons(onHandPc, pcPerCs){
  const pc = Number(onHandPc)||0, per = Number(pcPerCs)||0;
  if(per <= 0) return null;
  const exact = pc / per;
  const full = Math.floor(pc / per);
  return { exact, full, rem: pc - full*per, text: (Math.round(exact*10)/10).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}) };
}

// Suggested order, in cartons. Othaim ships min/max shelf targets per store+item:
// when on-hand has fallen to (or below) the min, refill up to the max — rounded to
// whole cartons, because that is the only way stock actually moves.
function suggestFor(sku, oh){
  const per = Number(sku.pcPerCs)||0;
  const onHand = oh ? Number(oh.onHand)||0 : 0;
  const min = oh ? Number(oh.min)||0 : 0;
  const max = oh ? Number(oh.max)||0 : 0;
  const base = (() => {
    if(per <= 0) return { cartons:0, reason:"nodata" };
    if(max > 0){
      const gap = max - onHand;
      if(gap > 0 && (onHand <= min || gap >= per)){
        const c = Math.max(0, Math.round(gap / per));
        if(c > 0) return { cartons:c, reason:"minmax" };
      }
      return { cartons: (onHand <= 0 ? 1 : 0), reason: onHand<=0 ? "oos" : "ok" };
    }
    return onHand <= 0 ? { cartons:1, reason:"oos" } : { cartons:0, reason:"nodata" };
  })();

  // Never suggest more than the Mars warehouse can actually ship — a "fill the shelf"
  // number the depot cannot cover is exactly the unsuitable quantity we want to avoid.
  const rec = OO.marsStock[sku.artecal];
  let cartons = base.cartons, capReason = null;
  if(rec && per > 0){
    const marsQ = Number(rec.qty)||0;
    if(marsQ <= 0){ if(cartons > 0){ cartons = 0; capReason = "nomars"; } }
    else if(cartons*per > marsQ){
      const c = Math.max(0, Math.floor(marsQ/per));
      // marsQ>0 here: if it can't even cover one carton, that's "less than a carton", NOT "none".
      if(c < cartons){ cartons = c; capReason = c > 0 ? "mars" : "marspartial"; }
    }
  }
  return { cartons, base: base.cartons, reason: base.reason, capReason, onHand, min, max };
}

// Flags an entered quantity that would clearly overshoot: far past the shelf's own
// max, or more pieces than the Mars warehouse can actually supply.
function qtyWarning(sku, oh, cartons){
  if(!cartons) return null;
  const per = Number(sku.pcPerCs)||0;
  const pieces = cartons * per;
  const marsQ = OO.marsStock[sku.artecal] ? Number(OO.marsStock[sku.artecal].qty)||0 : 0;
  if(marsQ > 0 && pieces > marsQ) return { key:"warnAboveMars", level:"warn" };
  const max = oh ? Number(oh.max)||0 : 0;
  const onHand = oh ? Number(oh.onHand)||0 : 0;
  if(max > 0 && (onHand + pieces) > max * 1.5) return { key:"warnAboveMax", level:"warn" };
  return null;
}

// Total value + per-category breakdown of what a store is currently holding.
// Memoized: the embedded dataset never changes during a session, so each store is
// summed only once — this is what keeps the store list and category switches instant.
const _stockCache = {};
function storeStock(storeNo){
  const key = String(storeNo);
  if(_stockCache[key]) return _stockCache[key];
  const oh = OO.onHand[key] || {};
  let value = 0, pieces = 0, skuCount = 0, outOfStock = 0;
  const byCat = {};
  (OO.skus||[]).forEach(sku => {
    const rec = oh[sku.artecal];
    if(!rec) return;
    const q = Number(rec.onHand)||0;
    const v = q * (Number(sku.pcPrice)||0);
    value += v; pieces += q; skuCount++;
    if(q <= 0) outOfStock++;
    const c = sku.category || "Uncategorized";
    const b = byCat[c] || (byCat[c] = { value:0, pieces:0, skus:0 });
    b.value += v; b.pieces += q; b.skus++;
  });
  const cats = Object.entries(byCat).map(([k,v]) => ({cat:k, ...v})).sort((a,b) => b.value - a.value);
  const res = { value, pieces, skuCount, outOfStock, cats, byCat };
  _stockCache[key] = res;
  return res;
}
// Live in-store value of ONE category (or all) at a store — used for the header total
// that reacts to the selected category chip.
function categoryStock(storeNo, category){
  const st = storeStock(storeNo);
  if(category === "all" || !category) return { value: st.value, pieces: st.pieces, skus: st.skuCount };
  return st.byCat[category] || { value:0, pieces:0, skus:0 };
}
// Opportunity test: Mars HAS stock of this SKU, but the store is out of it (or nearly — On Hand at
// or below the chosen threshold; a missing item counts as 0). These are the "go sell it in" items.
function isGapItem(sku, ohRec, threshold){
  const marsQ = OO.marsStock[sku.artecal] ? Number(OO.marsStock[sku.artecal].qty)||0 : 0;
  if(marsQ <= 0) return false;
  const ohQty = ohRec ? Number(ohRec.onHand)||0 : 0;
  return ohQty <= (Number(threshold)||0);
}
// What changed for ONE store in the last update: items newly supplied to it (added), items that
// disappeared (removed), and brand-new items Othaim added elsewhere that this store did NOT get
// (missing / not supplied here). Returns null if there's no recorded update diff yet.
function storeItemDiff(storeNo){
  const d = OO.meta && OO.meta.lastDiff;
  if(!d) return null;
  const k1 = String(storeNo), k2 = String(leadCode(storeNo));
  const bs = (d.byStore && (d.byStore[k1] || d.byStore[k2])) || {};
  const added = (bs.added || []).slice();
  const removed = (bs.removed || []).slice();
  const oh = OO.onHand[k1] || OO.onHand[k2] || {};
  const missing = (d.newSkus || []).filter(a => !(String(a) in oh) && !oh[a]);
  return { at: d.at, added, removed, missing };
}

// Pretty timestamp: "08-Sep-2026 - 8:19 AM" — date in blue, dash in grey, time in orange.
// Parses the stored "YYYY-MM-DD HH:MM" wall-clock straight from the string (no timezone shift).
const STAMP_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Current wall-clock in the DEVICE's local time (Saudi time for the team), "YYYY-MM-DD HH:MM".
// Used for update timestamps so the shown time matches when the manager actually updated
// (the old toISOString() stored UTC, which read 3 hours behind Saudi time).
function nowStamp(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function fmtStamp(ts){
  const m = String(ts||"").match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);
  if(!m) return null;
  let h = parseInt(m[4],10); const ap = h < 12 ? "AM" : "PM"; h = h % 12; if(h === 0) h = 12;
  const datePart = m[3] + "-" + (STAMP_MON[parseInt(m[2],10)-1] || m[2]) + "-" + m[1];
  const timePart = h + ":" + m[5] + " " + ap;
  const pill = el("span", {class:"stamp", dir:"ltr"});
  pill.appendChild(el("span", {class:"sdate"}, [datePart]));
  pill.appendChild(el("span", {class:"sdash"}, ["-"]));
  pill.appendChild(el("span", {class:"stime"}, [timePart]));
  return pill;
}
function renderStatusStrip(compact){
  const wrap = el("div", {class:"statusstrip", style: compact ? "margin-top:16px;border-radius:10px;overflow:hidden;border:1px solid var(--line);" : ""});
  const mk = (labelKey, tsKey) => {

    const cell = el("div", {class:"cell"});
    cell.appendChild(el("b", {}, [ el("span",{class:"dot dot-"+fr}), t(labelKey) ]));
    // Date/time always reads left-to-right (never bidi-reordered in the Arabic layout).
    cell.appendChild(fmtStamp(ts) || el("span", {class:"ts", dir:"ltr"}, [ t("never") ]));
    return cell;
  };
  wrap.appendChild(mk("stockUpdated","lastUpdatedMarsStock"));
  wrap.appendChild(mk("onhandUpdated","lastUpdatedOnHand"));

}
